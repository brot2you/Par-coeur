<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1218">
<title>Par Cœur ! — apprends tes textes et tes leçons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lexend:wght@400;600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PAR CŒUR ! — Theatre Pop Premium
   Palette : rouge rideau · or · crème · noir velours
   ========================================================= */
:root{
  --night:#151219; --night-2:#1d1820; --panel:#25202a; --panel-2:#2f2832; --line:#5e4b54;
  --velvet:#9a1d38; --velvet-d:#5f0f24; --velvet-l:#c8405b;
  --gold:#f0cd80; --gold-2:#dcae5a; --gold-d:#9c6a26;
  --cream:#fff5e5; --muted:#cdbfb6; --ok:#3aa877; --ok-d:#1f6b4b; --bad:#d85c64; --bad-d:#7e2230; --warn:#f4bf64;
}
*{box-sizing:border-box}
html{background:var(--night)}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.5;color:var(--cream);
  background:radial-gradient(ellipse at 50% -10%,#3a2330 0,var(--night) 60%) fixed;min-height:100vh;-webkit-text-size-adjust:100%}
body.has-nav{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.f-lexend{font-family:'Lexend',system-ui,sans-serif;letter-spacing:.02em;word-spacing:.12em}
body.s2{font-size:19px}
body.s3{font-size:22px}
.display,h1,h2,.p-title,.tt,.score,.rank{font-family:'Abril Fatface',Georgia,serif;font-weight:400}
body.f-lexend .display,body.f-lexend h2,body.f-lexend .p-title,body.f-lexend .tt,body.f-lexend .score,body.f-lexend .rank{font-family:'Lexend',sans-serif;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--gold)}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
.hidden{display:none!important}
.small{font-size:.85em}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center}

/* ---------- icônes ---------- */
.ic{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.22em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.btn .ic,.back .ic{margin-right:7px}

/* ---------- étoiles de maîtrise ---------- */
.stars{display:inline-flex;align-items:center}
.stars .sf{width:1.25em;height:1.25em;margin:0 2px;stroke:#d8bf8c;stroke-width:1.6;fill:none;opacity:.55}
.stars .sf.on{fill:var(--gold);stroke:#fff0c4;opacity:1;filter:drop-shadow(0 0 4px rgba(240,205,128,.55))}

/* ---------- accueil : la scène ---------- */
.curtain{position:relative;overflow:hidden;isolation:isolate;text-align:center;color:#fff;
  min-height:340px;padding:46px 16px 34px;border-bottom:5px solid var(--gold-2);
  background:linear-gradient(rgba(22,14,23,.15),rgba(20,13,21,.55)),url('img/scene.webp') center/cover,url('img/scene.png') center/cover,url('img/scene.jpg') center/cover,
  radial-gradient(ellipse at 50% 100%,#7b3a33 0,#2a1520 70%)}
.curtain .valance{position:absolute;left:0;right:0;top:0;height:30px;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0,#a8203d 0,#a8203d 58%,transparent 60%) 0 0/48px 30px repeat-x,linear-gradient(#5d0d20,#8a1832);
  border-bottom:3px solid var(--gold-2)}
.curtain .drape{position:absolute;top:0;bottom:0;width:22%;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(90deg,#4f0a1d 0,#9a1b36 14px,#6c1128 26px,#b02443 34px,#5c0d22 46px)}
.curtain .drape.l{left:0;border-radius:0 0 60% 0;box-shadow:8px 0 22px rgba(0,0,0,.5)}
.curtain .drape.r{right:0;border-radius:0 0 0 60%;box-shadow:-8px 0 22px rgba(0,0,0,.5)}
.curtain .spot{position:absolute;top:0;width:120px;height:300px;z-index:0;pointer-events:none;opacity:.28;
  background:linear-gradient(rgba(255,240,190,.9),transparent);-webkit-clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
.curtain .spot.l{left:18%;-webkit-transform:rotate(18deg);transform:rotate(18deg)}
.curtain .spot.r{right:18%;-webkit-transform:rotate(-18deg);transform:rotate(-18deg)}
.topbtns{position:absolute;right:max(10px,env(safe-area-inset-right));top:38px;z-index:4}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:6px;padding:0;border-radius:12px;
  background:rgba(20,12,18,.6);border:1.5px solid rgba(240,205,128,.7);color:#fff}
.icon-btn .ic{width:22px;height:22px}
.marquee{position:relative;z-index:3;display:inline-block;max-width:88%;margin-top:58px;padding:18px 30px 14px;border-radius:16px;
  background:linear-gradient(145deg,#2a1a24,#120d13);border:3px solid var(--gold);box-shadow:0 14px 34px rgba(0,0,0,.6)}
.marquee:before{content:'';position:absolute;top:-12px;left:-12px;right:-12px;bottom:-12px;border-radius:24px;pointer-events:none;border:5px dotted #ffe7a6;filter:drop-shadow(0 0 4px rgba(255,220,140,.8))}
.marquee h1{margin:0;font-size:clamp(2.5rem,9vw,4.4rem);line-height:1.02;color:#ffdc91;text-shadow:0 0 16px rgba(240,190,90,.55)}
.marquee p{margin:6px 0 0;font-weight:800;color:#ffe9c2;font-size:.9em;letter-spacing:.08em}
.brand{position:relative;z-index:3;margin-top:16px;font-size:.72em;letter-spacing:.3em;color:#ffd9a0;font-weight:800}
.hero-next{position:relative;z-index:3;display:flex!important;width:min(460px,92%);margin:22px auto 0!important;font-size:1.06em}
/* ouverture des rideaux (une fois par session) */
.opening{position:absolute;top:0;left:0;right:0;bottom:0;z-index:6;display:flex;pointer-events:none}
.opening i{display:block;width:50%;height:100%;background:repeating-linear-gradient(90deg,#540b20 0,#a01c38 16px,#6a1128 30px,#b52646 38px,#5a0c21 50px)}
.opening i.l{border-right:3px solid var(--gold-2);-webkit-animation:openL 1.3s cubic-bezier(.6,0,.3,1) .15s both;animation:openL 1.3s cubic-bezier(.6,0,.3,1) .15s both}
.opening i.r{border-left:3px solid var(--gold-2);-webkit-animation:openR 1.3s cubic-bezier(.6,0,.3,1) .15s both;animation:openR 1.3s cubic-bezier(.6,0,.3,1) .15s both}
@-webkit-keyframes openL{to{-webkit-transform:translateX(-101%)}}@keyframes openL{to{transform:translateX(-101%)}}
@-webkit-keyframes openR{to{-webkit-transform:translateX(101%)}}@keyframes openR{to{transform:translateX(101%)}}

/* ---------- barres ---------- */
.topbar{position:-webkit-sticky;position:sticky;top:0;z-index:20;display:flex;align-items:center;min-height:62px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
  background:linear-gradient(#2a1d27,#211821);border-bottom:2px solid var(--gold-2);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.topbar .back{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border-radius:12px;font-weight:800;white-space:nowrap;
  background:rgba(0,0,0,.25);border:1.5px solid rgba(240,205,128,.75);color:#fff}
.topbar .back .ic{margin-right:4px}
.topbar .tt{flex:1;text-align:center;font-size:1.25em;margin:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffe2a6}
.topbar .sp{width:84px;flex:none}
.topbar.tab .tt{text-align:left;margin-left:4px}
.topbar.tab .sp{display:none}
.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  background:rgba(29,22,30,.97);border-top:2px solid var(--gold-d);box-shadow:0 -6px 22px rgba(0,0,0,.45)}
.nav-tab{flex:1;max-width:170px;min-height:56px;margin:0 2px;border:0;border-radius:14px;background:transparent;color:#cdbcb8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.nav-tab .ic{width:24px;height:24px;margin-bottom:3px}
.nav-tab.active{background:#4a2636;color:#ffdb8b}
@media (min-width:900px){.bottom-nav{left:50%;right:auto;width:780px;-webkit-transform:translateX(-50%);transform:translateX(-50%);border:2px solid var(--gold-d);border-bottom:0;border-radius:18px 18px 0 0}}

/* ---------- éléments ---------- */
.card{background:var(--panel);border:1px solid #5b4a50;border-radius:20px;padding:16px;margin:0 0 16px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
h2.sec{display:flex;align-items:center;font-size:1.5em;margin:28px 4px 12px;color:#f3d496}
h2.sec .ic{width:1.05em;height:1.05em;margin-right:10px;color:var(--gold-2)}
h3{margin:0 0 8px;color:#f3d496}
.section-intro{color:#dcc6a8;margin:-4px 4px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:4px 6px 6px 0;padding:11px 18px;text-align:center;line-height:1.2;font-weight:800;
  border:1px solid #d0607a;border-bottom:4px solid var(--velvet-d);border-radius:14px;background:var(--velvet);color:#fff;
  -webkit-transition:-webkit-transform .12s;transition:transform .12s}
.btn:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
.btn.gold{background:linear-gradient(135deg,#fbe2a6,#dcae5a);color:#331f10;border-color:#ffefc4;border-bottom-color:var(--gold-d)}
.btn.ghost{background:#372e37;color:#fff4e7;border-color:#76636b;border-bottom-color:#18121a}
.btn.ok{background:var(--ok);border-color:#69cfa0;border-bottom-color:var(--ok-d)}
.btn.bad{background:#a8323e;border-color:#e0808a;border-bottom-color:var(--bad-d)}
.btn.big{width:100%;margin-right:0;padding:15px;font-size:1.07em}
.btn.half{width:calc(50% - 4px);margin-right:0}
.btn.half+.btn.half{margin-left:8px}
.btn.sm{min-height:40px;padding:6px 12px;margin:0}
.btn.on{background:#c62f3a;border-color:#ff9aa2}
.btn.stack{flex-direction:column;padding:8px 4px;font-size:.95em}
.btn.stack .ic{margin:0 0 4px;width:24px;height:24px}

/* ---------- salle de spectacle ---------- */
.theatre{position:relative;overflow:hidden;padding:18px 16px 0;border:2px solid #ae854a;
  background:linear-gradient(rgba(36,24,34,.5),rgba(28,19,27,.82)),url('img/salle.webp') center/cover,url('img/salle.png') center/cover,url('img/salle.jpg') center/cover,linear-gradient(#2b1b26,#40242b)}
.th-top{display:flex;justify-content:space-between;align-items:flex-start}
.rank{font-size:1.6em;color:#ffda8b;line-height:1.15;margin:2px 0}
.starcount{display:inline-flex;align-items:center;white-space:nowrap;margin-left:8px;padding:6px 14px;border-radius:999px;font-weight:900;font-size:1.1em;background:var(--gold);color:#2a1b14}
.starcount .ic{margin-right:5px}
.house{position:relative;margin:16px auto 0;max-width:560px;padding:10px 6px 4px;border-radius:50% 50% 0 0/26px 26px 0 0;
  background:radial-gradient(ellipse at 50% 0,rgba(255,226,150,.18),transparent 70%)}
.seats{display:flex;flex-wrap:wrap;justify-content:center}
.seat{position:relative;width:38px;height:44px;margin:1px}
.seat svg{display:block;width:100%;height:100%}
.seat.on .who{-webkit-animation:arrive .5s cubic-bezier(.3,1.4,.5,1) both;animation:arrive .5s cubic-bezier(.3,1.4,.5,1) both}
@-webkit-keyframes arrive{from{-webkit-transform:translateY(-18px) scale(.6);opacity:0}}
@keyframes arrive{from{transform:translateY(-18px) scale(.6);opacity:0}}
.stage-floor{height:22px;margin:14px -16px 0;border-top:4px solid var(--gold-2);background:repeating-linear-gradient(90deg,#65412b 0,#815334 38px,#5c3529 76px)}
.house-legend{text-align:center;font-size:.8em;color:#dcc6a8;margin-top:6px}

/* ---------- à l'affiche ce soir ---------- */
.todo{display:flex;align-items:center;width:100%;min-height:76px;margin:0 0 10px;padding:12px 14px;text-align:left;border-radius:16px;
  background:#2a222c;color:#fff2df;border:1px solid #6c5358;border-left:7px solid var(--pc,#d7ad68)}
.todo .ti{display:flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;margin-right:12px;border-radius:12px;background:var(--pc,#7b2038);color:#fff}
.todo .ti .ic{width:24px;height:24px}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .go{display:inline-flex;align-items:center;margin-left:8px;font-weight:900;color:#f1d08c;white-space:nowrap}
.todo .stars{font-size:.9em}
.relache{text-align:center;padding:20px;color:#eee0c9}
.relache .ic{width:34px;height:34px;color:var(--gold);display:block;margin:0 auto 6px}

/* ---------- affiches ---------- */
.posters{display:flex;flex-wrap:wrap;margin:0 -7px}
.poster{position:relative;width:calc(50% - 14px);min-height:236px;margin:7px;padding:22px 12px 16px;border-radius:9px;color:#fff;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:linear-gradient(160deg,rgba(18,12,23,.45),rgba(0,0,0,.25)),url('img/affiche.webp') center/cover,url('img/affiche.png') center/cover,linear-gradient(150deg,var(--pc,#7b2038),#1a101a 110%);
  border:2px solid #caa15b;box-shadow:0 8px 0 #110d13,0 12px 24px rgba(0,0,0,.45)}
.poster:before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:1px solid rgba(232,203,145,.8);border-radius:5px;pointer-events:none}
.poster:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
@media (min-width:650px){.poster{width:calc(33.333% - 14px)}}
.p-kind{display:inline-flex;align-items:center;font-size:.7em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#ffe1a4}
.p-kind .ic{margin-right:5px}
.p-title{display:block;font-size:1.35em;line-height:1.12;margin:8px 0 4px;word-break:break-word;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.p-author{font-style:italic;font-size:.85em;color:#fff1df}
.p-stars{margin-top:8px}
.p-due{margin-top:8px;padding:2px 10px;border-radius:999px;font-size:.78em;font-weight:800;background:rgba(20,14,20,.85);color:#fff1da}
.p-due.soon{background:var(--gold);color:#241821}
.poster.new{background:#2c232b;border:2px dashed #bb9257;box-shadow:none;color:#f5d48b;justify-content:center;font-weight:900}
.poster.new:before{display:none}
.poster.new .ic{width:44px;height:44px;margin-bottom:8px}
.poster.mastered:after{content:'SU PAR CŒUR';position:absolute;top:16px;right:-6px;padding:3px 9px;font-size:.62em;font-weight:900;letter-spacing:.1em;
  background:var(--gold);color:#2a1b14;border-radius:4px 0 0 4px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.poster.big{display:block;width:auto;min-height:0;margin:0 0 14px;padding:26px 16px 22px}
.poster.big .p-title{font-size:2em}
.poster.big .p-meta{display:block;font-size:.85em;margin-top:6px;color:#fff1df}
.poster.big .p-stars{display:block;font-size:1.15em}

/* ---------- loge ---------- */
.infos{display:flex;margin:0 -5px 14px}
.info{flex:1;margin:0 5px;padding:10px 6px;text-align:center;border-radius:14px;background:var(--panel-2);border:1px solid #68535d}
.info b{display:block;font-size:1.1em;color:#f7d48f}
.info span{font-size:.75em;color:#ded0c7}
.veille{background:#231a3d;border-color:#6b58a8}
.veille h3{display:flex;align-items:center}
.veille h3 .ic{margin-right:8px;color:#ffd86b}
.modes{display:flex;flex-wrap:wrap;margin:0 -5px}
.mode{width:calc(50% - 10px);min-height:132px;margin:5px;padding:14px 12px;text-align:left;border-radius:17px;background:var(--panel-2);color:#fff2e7;border:1px solid #68535d;border-bottom:4px solid #1b151b}
.mode:active{-webkit-transform:translateY(2px);transform:translateY(2px)}
.mode .mi{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:13px;background:#4a2636;color:#ffd98a}
.mode .mi .ic{width:26px;height:26px}
.mode b{display:block;margin:8px 0 2px;font-size:1.02em;color:#f7d48f}
.mode .d{display:block;font-size:.82em;color:#ded0c7}
.mode.hero{width:calc(100% - 10px);min-height:0;display:flex;align-items:center;background:linear-gradient(135deg,#fbe2a6,#dcae5a);border-color:#ffefc4;border-bottom-color:var(--gold-d)}
.mode.hero .mi{background:#3a2316;color:#ffd98a;margin-right:14px;flex:none}
.mode.hero b{color:#331f10;margin-top:0}
.mode.hero .d{color:#5a3a12}
.steps .st{display:flex;align-items:flex-start;padding:10px 0;border-bottom:1px dashed #64505a}
.steps .st:last-child{border-bottom:0}
.st .s{display:flex;align-items:center;justify-content:center;flex:none;width:40px;height:40px;margin-right:12px;border-radius:50%;background:#3a3039;color:#8f7f86;border:2px solid #5a4a52}
.st .s .ic{width:22px;height:22px}
.st.on .s{background:var(--gold);color:#2a1b14;border-color:#fff0c4;box-shadow:0 0 12px rgba(240,205,128,.45)}
.st b{display:block}
.st .tick{display:flex;align-items:center;margin:1px 0 0;font-size:.78em;color:var(--gold)}
.st .tick .ic{margin-right:4px}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #64505a;font-size:.9em}
.hist li:last-child{border-bottom:0}

/* ---------- écrans de travail : lisibilité d'abord ---------- */
.reading-page .card{background:#1e1a22;border-color:#4d4048}
.reading{font-size:max(20px,1.16em);line-height:1.85;color:#fff8eb;max-width:72ch;margin:0 auto}
body.sp2 .reading{line-height:2.35}
.line{padding:6px 10px;border-radius:8px;margin:1px 0}
.rl{cursor:pointer}
.rl.hl{background:#5c4637;color:#fff}
.gap{height:.9em}
.line.new{font-weight:800;background:#584536;color:#fff}
.line.faded{color:#ab9da0}
.bar{display:inline-block;height:.8em;border-radius:6px;vertical-align:middle;background:#6d5f67}
.w{white-space:nowrap}
.w.hid{cursor:pointer;color:#e5c78e;letter-spacing:.05em}
.w.hid .o{display:none}
.w.hid.peeked .m{display:none}
.w.hid.peeked .o{display:inline;color:var(--warn);font-weight:800;letter-spacing:0}
.qa{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#2b242d}
.qa .q{display:flex;align-items:flex-start;font-weight:800;color:#f7d48f}
.qa .q .ic{margin:.3em 8px 0 0}
.levels{display:flex;margin:8px -3px 12px}
.lv{flex:1;margin:0 3px;padding:8px 2px;min-height:48px;border-radius:10px;font-size:.72em;font-weight:800;text-align:center;line-height:1.2;background:#302832;color:#f8eee4;border:2px solid #79616b}
.lv.on{background:#8b2440;border-color:var(--gold)}
.progress{height:12px;margin:8px 0;border-radius:999px;overflow:hidden;background:#4d3f46}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e9a74a);-webkit-transition:width .3s;transition:width .3s}
.flash{display:flex;flex-direction:column;justify-content:center;min-height:220px;padding:26px 16px;text-align:center}
.flash .q{font-size:1.3em;font-weight:900;color:#f7d48f}
.flash .a{margin-top:16px;padding:12px;font-size:1.1em;border-radius:12px;background:#4b3b39;color:#fff1d5;border:1px solid #a48456}
.souffleur{display:flex;align-items:center;margin:8px 0;padding:10px 12px;border-radius:12px;font-weight:700;background:#4b3b39;color:#fff1d5;border:1px dashed var(--gold-2)}
.souffleur .ic{margin-right:8px;color:var(--gold)}
.speed{display:inline-flex;align-items:center;margin-left:6px;font-size:.85em;font-weight:700;color:var(--muted)}
.speed input{margin:0 8px}

/* ---------- formulaires ---------- */
textarea,input[type=text],input[type=date],select{width:100%;min-height:50px;margin:4px 0 10px;padding:12px;font:inherit;border-radius:12px;background:#17141b;color:var(--cream);border:2px solid #7d6a73;-webkit-appearance:none;appearance:none}
textarea{min-height:200px;line-height:1.6;resize:vertical}
textarea.short{min-height:76px}
textarea::placeholder,input::placeholder{color:#a8999f}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,194,121,.3)}
label.f{display:block;margin-top:4px;font-weight:800;font-size:.9em;color:#f0d3a4}
.seg{display:flex;margin:4px -3px 12px}
.seg button{flex:1;min-height:50px;margin:0 3px;padding:8px 4px;border-radius:12px;font-weight:800;font-size:.85em;line-height:1.2;background:#342b34;color:#fff;border:2px solid #76636c}
.seg button .ic{display:block;margin:0 auto 4px;width:22px;height:22px}
.seg button.on{background:#8d2541;border-color:var(--gold)}
.cardrow{position:relative;margin-bottom:10px;padding:10px;border-radius:14px;background:#2d262f;border:1px solid #5d4c55}
.cardrow .del{position:absolute;right:4px;top:2px;min-width:44px;min-height:44px;background:none;border:none;color:#e8a5ab}
.err{color:#ffaaa9;font-weight:800;margin:6px 0}
input[type=range]{width:120px;vertical-align:middle;accent-color:var(--gold)}
hr.sep{border:0;border-top:1px dashed #6a5860;margin:16px 0}

/* ---------- résultats ---------- */
.score{display:flex;align-items:center;justify-content:center;font-size:3.2em;line-height:1;color:#f6d184}
.score .ic{width:.8em;height:.8em;margin-right:12px}
.verdict{text-align:center;font-weight:900;font-size:1.15em;margin:8px 0 12px}
.r-ok{color:#8be0b2}
.r-acc{color:#f6d184;text-decoration:underline}
.r-miss{color:#ffb1b1;background:#562d39;border-radius:4px;padding:0 2px}
.lmark{float:right;margin-left:6px}
.lmark.ok{color:#8be0b2}.lmark.ko{color:#f6a35c}
.legend span{margin-right:12px;white-space:nowrap}

/* ---------- récompenses ---------- */
.reward-grid{display:flex;flex-wrap:wrap;margin:0 -7px}
.reward-item{width:calc(50% - 14px);margin:7px;padding:18px 10px 14px;text-align:center;border-radius:16px;background:#2c232c;border:1px solid #957047}
.medal{position:relative;display:flex;align-items:center;justify-content:center;width:88px;height:88px;margin:0 auto 10px;border-radius:50%;border:5px double var(--mc,#e6c37c);color:var(--mc,#f4d68f);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(0,0,0,.25))}
.medal .ic{width:40px;height:40px}
.medal img{position:absolute;top:-6px;left:-6px;width:calc(100% + 12px);height:calc(100% + 12px);object-fit:contain}
.reward-item.locked .medal{-webkit-filter:grayscale(1);filter:grayscale(1);opacity:.45}
.reward-item.got{border-color:var(--gold);box-shadow:0 0 18px rgba(240,205,128,.22)}
.reward-item b{display:block}
.diag li{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #64505a;font-size:.9em}
.diag .y{color:#8be0b2;font-weight:800}.diag .n{color:#ffb1b1;font-weight:800}
.reward-item .progress{height:8px;margin:8px 6px 2px}

/* ---------- modale, toast, célébrations ---------- */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,7,11,.78)}
.modal-box{width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:20px 18px calc(26px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;
  background:#29212b;border:2px solid #c69b5d;border-bottom:0;color:var(--cream);-webkit-overflow-scrolling:touch;-webkit-animation:up .25s ease;animation:up .25s ease}
@media (min-width:620px){.modal{align-items:center}.modal-box{border-radius:22px;border-bottom:2px solid #c69b5d}}
@-webkit-keyframes up{from{-webkit-transform:translateY(40px);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h2{display:flex;align-items:center;margin:0 0 10px;color:#f1d08c}
.modal h2 .ic{margin-right:10px;color:var(--gold-2)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));z-index:60;max-width:90%;padding:12px 18px;border-radius:14px;font-weight:700;text-align:center;
  background:#3d2934;border:1px solid #d7ac68;color:#fff;visibility:hidden;-webkit-transform:translate(-50%,160px);transform:translate(-50%,160px);-webkit-transition:-webkit-transform .3s;transition:transform .3s}
.toast.on{visibility:visible;-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}
.celebr{text-align:center}
.burst{position:relative;width:150px;height:150px;margin:4px auto 6px}
.burst .rays{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;
  background:repeating-conic-gradient(rgba(240,205,128,.35) 0 10deg,transparent 10deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);
  -webkit-animation:spin 1.6s ease-out both;animation:spin 1.6s ease-out both}
.burst .big{position:absolute;top:25px;left:25px;width:100px;height:100px;fill:var(--gold);stroke:#fff3cf;stroke-width:1.2;filter:drop-shadow(0 0 14px rgba(240,190,90,.7));
  -webkit-animation:pop .7s cubic-bezier(.3,1.5,.5,1) both;animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
.burst .big.stroke{fill:none;stroke:var(--gold);stroke-width:1.7}
@-webkit-keyframes spin{from{-webkit-transform:rotate(-90deg) scale(.4);opacity:0}to{-webkit-transform:rotate(0) scale(1);opacity:1}}
@keyframes spin{from{transform:rotate(-90deg) scale(.4);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
@-webkit-keyframes pop{0%{-webkit-transform:scale(0)}100%{-webkit-transform:scale(1)}}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.celebr .what{display:inline-flex;align-items:center;font-weight:900;font-size:1.1em;color:#ffe2a6}
.celebr .what .ic{margin-right:8px}
/* grand final : rideau + applaudissements */
.finale{position:relative;height:200px;margin:-4px -2px 10px;border-radius:16px;overflow:hidden;border:2px solid var(--gold-2);
  background:radial-gradient(ellipse at 50% 30%,#fff1c2 0,#d9a24a 22%,#3a1d1d 62%,#1a0f14 100%)}
.finale .who-on{position:absolute;left:50%;bottom:14px;width:64px;height:96px;margin-left:-32px}
.finale .crown{position:absolute;left:50%;top:22px;width:46px;height:46px;margin-left:-23px;color:#fff3c4;-webkit-animation:pop .6s .9s both;animation:pop .6s .9s both}
.finale .cl{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#540b20 0,#a01c38 14px,#6a1128 26px,#b52646 34px,#5a0c21 44px)}
.finale .cl.l{left:0;-webkit-animation:closeL 1.6s .2s cubic-bezier(.6,0,.3,1) both;animation:closeL 1.6s .2s cubic-bezier(.6,0,.3,1) both}
.finale .cl.r{right:0;-webkit-animation:closeR 1.6s .2s cubic-bezier(.6,0,.3,1) both;animation:closeR 1.6s .2s cubic-bezier(.6,0,.3,1) both}
@-webkit-keyframes closeL{0%{-webkit-transform:translateX(0)}35%{-webkit-transform:translateX(-100%)}100%{-webkit-transform:translateX(-100%)}}
@keyframes closeL{0%{transform:translateX(0)}35%{transform:translateX(-100%)}100%{transform:translateX(-100%)}}
@-webkit-keyframes closeR{0%{-webkit-transform:translateX(0)}35%{-webkit-transform:translateX(100%)}100%{-webkit-transform:translateX(100%)}}
@keyframes closeR{0%{transform:translateX(0)}35%{transform:translateX(100%)}100%{transform:translateX(100%)}}
.clap{position:absolute;bottom:-30px;width:34px;height:34px;color:#ffe2a6;opacity:0;-webkit-animation:clapUp 1.4s ease-out both;animation:clapUp 1.4s ease-out both}
@-webkit-keyframes clapUp{0%{opacity:0;-webkit-transform:translateY(0) scale(.6)}25%{opacity:1}100%{opacity:0;-webkit-transform:translateY(-190px) scale(1.1)}}
@keyframes clapUp{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-190px) scale(1.1)}}
.confetti{position:fixed;top:-20px;z-index:70;width:10px;height:14px;pointer-events:none;-webkit-animation:fall 1.6s linear forwards;animation:fall 1.6s linear forwards}
@-webkit-keyframes fall{to{-webkit-transform:translateY(110vh) rotate(720deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.tip{background:#2f2531;border:1px solid #987548}
.tip b{display:flex;align-items:center;color:#f1d49a}
.tip b .ic{margin-right:8px}
.codebox{max-height:120px;overflow:auto;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:.75em;word-break:break-all;border-radius:10px;background:#1b1720;color:#fff;-webkit-user-select:all;user-select:all}
footer{text-align:center;color:#bfb0ab;font-size:.8em;padding:10px 14px 24px}
.recdot{display:inline-block;width:12px;height:12px;margin-right:8px;border-radius:50%;background:#ffda86}
.btn.on .recdot{-webkit-animation:blink 1s steps(2) infinite;animation:blink 1s steps(2) infinite}
@-webkit-keyframes blink{50%{opacity:.2}}@keyframes blink{50%{opacity:.2}}
.take{display:flex;align-items:center;margin:8px 0}
.take span{width:80px;font-weight:800;font-size:.9em}
.take audio{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{-webkit-animation-duration:.01ms!important;animation-duration:.01ms!important;-webkit-transition-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

/* ---------------- découpage & comparaison ---------------- */
function splitLines(raw){
  var arr = String(raw).replace(/\r/g,'').split('\n'), out = [], lastBlank = true;
  for (var i = 0; i < arr.length; i++){
    var l = arr[i].replace(/^\s+|\s+$/g,'');
    if (l === ''){ if (!lastBlank){ out.push(''); lastBlank = true; } }
    else { out.push(l); lastBlank = false; }
  }

  return out;
}

    if (!txt) continue;
    var parts = txt.match(/[^.!?…]+[.!?…]+["»”')\]]*|[^.!?…]+$/g) || [txt];
    if (out.length) out.push('');
    for (var i = 0; i < parts.length; i++){ var s = parts[i].replace(/^\s+|\s+$/g,''); if (s) out.push(s); }
  }
  return out;
}

}

  var raw = String(str).toLowerCase().replace(/[’`ʼ]/g,"'").split(/[\s'\-–—]+/), out = [];
  for (var i = 0; i < raw.length; i++){
    var a = raw[i].replace(/[^0-9a-zà-öø-ÿœæß]/g,'');
    if (a === '') continue;
    out.push({ a:a, l:stripAcc(a) });
  }

}
function lcs(A, B){

    for (j = m-1; j >= 0; j--){
      dp[i*W+j] = (A[i].l === B[j].l) ? dp[(i+1)*W+j+1] + 1 : Math.max(dp[(i+1)*W+j], dp[i*W+j+1]);

  }

  i = 0; j = 0;
  while (i < n && j < m){
    if (A[i].l === B[j].l){ res[i] = j; i++; j++; }
    else if (dp[(i+1)*W+j] >= dp[i*W+j+1]) i++;

  }
  return res;
}
/* compare la récitation à la référence (lignes choisies) */
function compareText(lines, idxs, typed){
  var ref = [], words = [], i, k;
  for (i = 0; i < idxs.length; i++){
    var ws = splitWords(lines[idxs[i]]);
    for (var wi = 0; wi < ws.length; wi++){
      var w = { li:idxs[i], text:ws[wi], t:[] };
      var ct = ctoks(ws[wi]);
      for (k = 0; k < ct.length; k++){ ref.push(ct[k]); w.t.push(ref.length-1); }
      words.push(w);
    }
  }
  var hyp = ctoks(typed);
  if (hyp.length > ref.length*3 + 50) hyp = hyp.slice(0, ref.length*3 + 50);
  var m = lcs(ref, hyp), st = [], matched = 0, accents = 0;
  for (i = 0; i < ref.length; i++){
    if (m[i] < 0) st.push(0);
    else { matched++; if (ref[i].a === hyp[m[i]].a) st.push(2); else { st.push(1); accents++; } }
  }
  var perLine = {};
  for (i = 0; i < words.length; i++){
    var wd = words[i], all2 = true, any = false;
    for (k = 0; k < wd.t.length; k++){ if (st[wd.t[k]] !== 2) all2 = false; if (st[wd.t[k]] > 0) any = true; }
    wd.s = wd.t.length === 0 ? 'ok' : (all2 ? 'ok' : (any ? 'acc' : 'miss'));
    if (!perLine[wd.li]) perLine[wd.li] = { tot:0, ok:0 };
    for (k = 0; k < wd.t.length; k++){ perLine[wd.li].tot++; if (st[wd.t[k]] > 0) perLine[wd.li].ok++; }
  }
  return {
    score: ref.length ? Math.round(matched / ref.length * 100) : 0,
    words: words, perLine: perLine, accents: accents,

}

/* ---------------- masquage des mots ---------------- */
function rnd(a, b){ var x = Math.sin((a+1)*12.9898 + (b+1)*78.233) * 43758.5453; return x - Math.floor(x); }

}

function initWord(w){ return '<span class="w hid" data-act="peek"><span class="m">' + esc(maskWord(w, true)) + '</span><span class="o">' + esc(w) + '</span></span>'; }

    else if (lv === 3) out.push(initWord(w));
    else if (lv === 4) out.push(hidWord(w));
    else if (rnd(li, wi)*100 < THRESH[lv]) out.push(hidWord(w));

}

/* ---------------- synthèse vocale ---------------- */
var hasTTS = ('speechSynthesis' in window) && (typeof window.SpeechSynthesisUtterance !== 'undefined');

}

function clearHL(){ var h = document.querySelectorAll('.rl.hl'); for (var i = 0; i < h.length; i++) h[i].className = h[i].className.replace(/\s?hl/g,''); }
function readItems(t){
  var r = [];
  if (t.kind === 'lecon'){ for (var i = 0; i < t.cards.length; i++){ r.push(t.cards[i].q); r.push(t.cards[i].a); } }

function readFrom(t, idx, chain){

    openModal('<h2>' + ic('mic') + 'Enregistrement indisponible</h2><p>Ce navigateur (ou cette page) ne donne pas accès au micro. Ouvre l\'appli directement dans Safari ou Chrome. En attendant, tu peux utiliser l\'appli Dictaphone de ton téléphone : le principe est le même !</p><button class="btn gold big" data-act="close">OK</button>');

function b64enc(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

function shareCode(t){
  var o = { k:t.kind, ti:t.title, au:t.author, su:t.subject, la:t.lang };
  if (t.kind === 'lecon'){ o.ca = []; for (var i = 0; i < t.cards.length; i++) o.ca.push([t.cards[i].q, t.cards[i].a]); }
  else o.li = t.lines;

function parseShare(code){

    var o = JSON.parse(b64dec(m[1]));

    var d = { kind:o.k, title:o.ti, author:o.au, subject:o.su, lang:o.la, lines:o.li || [], cards:[] };
    if (o.ca){ for (var i = 0; i < o.ca.length; i++) d.cards.push({ q:o.ca[i][0], a:o.ca[i][1] }); }

function applause(dur){
  if (!soundOn()) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;

    var ctx = applause.ctx; if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    var sr = ctx.sampleRate, len = Math.floor(sr * dur), buf = ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    var claps = Math.floor(dur * 42);

      var st = Math.floor(Math.random() * (len - sr * 0.04)), cl = Math.floor(sr * (0.008 + Math.random() * 0.012));
      var amp = (0.22 + Math.random() * 0.3) * (1 - (st / len) * 0.7);
      for (var k = 0; k < cl; k++) d[st + k] += (Math.random() * 2 - 1) * amp * Math.exp(-k / (cl / 4));
    }
    var src = ctx.createBufferSource(); src.buffer = buf;
    var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.6;
    var g = ctx.createGain(); g.gain.value = 0.55;
    src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(0);
  } catch(e){}
}

/* ---------- vers par vers ---------- */
VIEWS.chaine = function(p){
  var t = getT(p.id), L = learnIdx(t), N = L.length, unitName = KINDS[t.kind].unit === 'vers' ? 'Vers' : 'Phrase';
  if (p.k == null) p.k = Math.min(Math.max(1, t.chainPos || 1), N);
  if (!p.ph) p.ph = 'learn';
  var k = p.k, h = topbar(unitName + ' par ' + unitName.toLowerCase(), 'ladder') + '<main class="wrap reading-page">';
  if (p.ph === 'done'){
    return h + '<section class="card center"><div class="celebr"><div class="burst"><span class="rays"></span><svg class="big" viewBox="0 0 24 24" aria-hidden="true">' + ICONS.mask + '</svg></div></div><h2>Tout le texte enchaîné !</h2><p>Tu as répété les ' + N + ' ' + KINDS[t.kind].unit + ' les uns après les autres. Passe à l\'effacement ou tente directement la générale.</p>' +
      '<button class="btn gold big" data-act="mode" data-m="generale">' + ic('clapper') + 'Tenter la générale</button><button class="btn ghost big" data-act="mode" data-m="effacement">' + ic('eraser') + 'Passer à l\'effacement</button><button class="btn ghost big" data-act="chain" data-do="restart">' + ic('restart') + 'Recommencer du début</button></section></main>';
  }
  h += '<section class="card"><div class="between"><b>' + unitName + ' ' + k + ' / ' + N + '</b><button class="btn ghost sm" data-act="chain" data-do="listen">' + ic('sound') + 'Écouter</button></div><div class="progress"><i style="width:' + Math.round((k-1)/N*100) + '%"></i></div>';
  var msg = { learn:'Lis la nouvelle ligne (surlignée) plusieurs fois à voix haute. Les lignes d\'avant ne montrent que leurs initiales.', test:'Maintenant, récite <b>de la première ligne jusqu\'à la nouvelle</b>, à voix haute, sans regarder.', check:'Vérifie : est-ce que tu as tout dit sans erreur ?' }[p.ph];
  h += '<p class="small muted">' + msg + '</p><div class="reading">';
  var last = L[k-1];
  for (var i = 0; i <= last; i++){
    var line = t.lines[i];
    if (line === ''){ h += '<div class="gap"></div>'; continue; }
    if (p.ph === 'test') h += '<div class="line">' + barLine(line) + '</div>';
    else if (p.ph === 'check') h += '<div class="line">' + esc(line) + '</div>';
    else if (i === last) h += '<div class="line new">' + esc(line) + '</div>';
    else h += '<div class="line faded">' + initialsLine(line) + '</div>';
  }
  h += '</div></section>';
  if (p.ph === 'learn') h += '<button class="btn gold big" data-act="chain" data-do="hide">' + ic('eyeoff') + 'Je cache et je récite</button>';
  else if (p.ph === 'test') h += '<button class="btn gold big" data-act="chain" data-do="check">' + ic('eye') + 'Vérifier</button>';
  else h += '<div class="row"><button class="btn ok half" data-act="chain" data-do="ok">' + ic('check') + 'Je l\'avais</button><button class="btn bad half" data-act="chain" data-do="again">' + ic('restart') + 'Pas encore</button></div>';
  if (k > 1) h += '<p class="center"><button class="btn ghost" data-act="chain" data-do="restart">' + ic('restart') + 'Recommencer du début</button></p>';
  return h + '</main>';
};

/* ---------- générale (poème / texte) ---------- */
function verdictOf(score){ return score >= 95 ? 'Standing ovation !' : score >= 80 ? 'Bravo, le public applaudit !' : score >= 50 ? 'Pas mal ! Encore quelques répétitions.' : 'Le rideau tombe trop tôt… on répète !'; }
VIEWS.generale = function(p){
  var t = getT(p.id), L = p.subset && p.subset.length ? p.subset : learnIdx(t), i;
  var h = topbar(p.subset ? 'Veille ciblée' : 'La générale', p.subset ? 'moon' : 'clapper') + '<main class="wrap reading-page">';
  if (p.res){
    var r = p.res;
    h += '<section class="card"><div class="score">' + r.score + ' %</div><div class="verdict">' + verdictOf(r.score) + '</div>';
    h += '<p class="small legend center"><span class="r-ok">■ juste</span> <span class="r-acc">■ presque</span> <span class="r-miss">■ oublié</span></p>';
    h += '<div class="reading">';
    var byLine = {};
    for (i = 0; i < r.words.length; i++){ var w = r.words[i]; if (!byLine[w.li]) byLine[w.li] = []; byLine[w.li].push('<span class="r-' + w.s + '">' + esc(w.text) + '</span>'); }
    var prev = -1;
    for (i = 0; i < L.length; i++){
      if (!p.subset && prev >= 0 && L[i] > prev + 1) h += '<div class="gap"></div>';
      var pl = r.perLine[L[i]], good = pl && pl.tot ? pl.ok / pl.tot >= 0.9 : true;
      h += '<div class="line"><span class="lmark ' + (good ? 'ok' : 'ko') + '" title="' + (good ? 'ligne sue' : 'à retravailler') + '">' + ic(good ? 'check' : 'restart') + '</span>' + (byLine[L[i]] || []).join(' ') + '</div>';
      prev = L[i];
    }
    h += '</div>';
    var notes = [];
    if (r.accents) notes.push(r.accents + ' mot(s) presque juste(s) : vérifie les accents et l\'orthographe.');
    if (r.extra) notes.push(r.extra + ' mot(s) en trop ou différent(s) dans ta récitation.');
    if (p.souf) notes.push('Souffleur appelé ' + p.souf + ' fois.');
    if (notes.length) h += '<p class="small muted">' + esc(notes.join(' ')) + '</p>';
    h += '</section>';
    var weak = weakLines(t, r);
    if (weak.length) h += '<button class="btn gold big" data-act="redoWeak">' + ic('target') + 'Retravailler les ' + weak.length + ' ligne(s) ratée(s)</button>';
    h += '<button class="btn ghost big" data-act="genRestart">' + ic('restart') + 'Refaire la générale</button><button class="btn ghost big" data-act="back">' + ic('back') + 'Retour à la loge</button>';
    return h + '</main>';
  }
  if (p.souf == null) p.souf = 0;
  h += '<section class="card"><p style="margin-top:0"><b>Récite sans regarder.</b> ' + (p.subset ? 'Seulement les <b>' + L.length + ' ligne(s)</b> à retravailler.' : 'Tout le texte : ' + L.length + ' ' + KINDS[t.kind].unit + '.') + ' Écris ' + (t.kind === 'poeme' ? 'en allant à la ligne à chaque vers' : 'ton texte') + ', ou dicte-le avec le micro.</p>';
  if (p.subset){
    h += '<p class="small muted">Les lignes à retrouver commencent par :</p><div class="reading small">';
    for (i = 0; i < L.length; i++) h += '<div class="line faded">' + esc(splitWords(t.lines[L[i]]).slice(0,1).join(' ')) + ' …</div>';
    h += '</div>';
  }
  h += '<textarea id="gen" data-bind="draft" placeholder="Écris ta récitation ici…" autocapitalize="sentences" spellcheck="false">' + esc(p.draft || '') + '</textarea>';
  h += '<div id="dictStatus"></div><div id="souf"></div>';
  h += '<div class="row"><button class="btn ghost" id="dictBtn" data-act="dictate">' + ic('mic') + 'Dicter</button><button class="btn ghost" data-act="souffleur">' + ic('bulb') + 'Souffleur</button></div></section>';
  h += '<button class="btn gold big" data-act="genCheck">' + ic('mask') + 'Lever de rideau : je vérifie !</button>';
  return h + '</main>';
};
function weakLines(t, r){
  var out = [];
  for (var li in r.perLine){ var pl = r.perLine[li]; if (pl.tot && pl.ok / pl.tot < 0.9) out.push(+li); }
  out.sort(function(a, b){ return a - b; });
  return out;
}

/* ---------- enregistrement ---------- */
VIEWS.enreg = function(p){
  var t = getT(p.id), i, h = topbar('Enregistre-toi', 'mic') + '<main class="wrap reading-page">';
  var takes = TAKES[t.id] || [];

/* ---------- générale (leçon) ---------- */
VIEWS.lgenerale = function(p){

  if (!p.list){

    return h + '<section class="card"><div class="score">' + score + ' %</div><div class="verdict">' + verdictOf(score) + '</div><p class="center">' + p.ok + ' question(s) sue(s) sur ' + p.list.length + '.</p></section>' +
      '<button class="btn gold big" data-act="mode" data-m="questions">' + ic('cards') + 'Retravailler avec les questions</button><button class="btn ghost big" data-act="mode" data-m="lgenerale">' + ic('restart') + 'Refaire la générale</button><button class="btn ghost big" data-act="back">' + ic('back') + 'Retour à la loge</button></main>';
  }

    h += '<button class="btn gold big" data-act="lCheck">' + ic('eye') + 'Voir la réponse</button>';
  } else {
    var sug = null;

      var r = compareText([c.a], [0], p.ans), parts = [];

      sug = r.score >= 70;
    } else {
      h += '<p class="small muted" style="margin-bottom:4px">Réponse attendue :</p><div class="flash" style="min-height:0;padding:0"><div class="a" style="margin-top:0">' + esc(c.a) + '</div></div>';
    }
    h += '<p class="small" style="margin-bottom:0">Sois honnête avec toi-même : l\'essentiel y était ?' + (sug === true ? ' <b>On dirait que oui !</b>' : sug === false ? ' <b>Il manque des éléments.</b>' : '') + '</p>';
  }
  h += '</section>';
  if (p.ph === 'check') h += '<div class="row"><button class="btn ok half" data-act="lRate" data-r="1">' + ic('check') + 'Je savais</button><button class="btn bad half" data-act="lRate" data-r="0">' + ic('x') + 'Je ne savais pas</button></div>';

      h += '<p class="small muted">Une question par ligne, puis <b>|</b> puis la réponse. Exemple :<br><i>Date de la prise de la Bastille ? | Le 14 juillet 1789</i><br>Si tu oublies le |, tout ce qui suit le « ? » devient la réponse.</p><textarea id="bulk" class="short" style="min-height:120px"></textarea><button class="btn gold" data-act="bulkAdd">Ajouter ces lignes</button>';

    h += '<textarea id="fRaw" data-bind="d.raw" placeholder="Colle ton texte ici…">' + esc(d.raw) + '</textarea><p class="small muted" id="preview">' + previewTxt(d) + '</p>';

};
function previewTxt(d){
  if (d.kind === 'lecon') return '';
  var lines = d.kind === 'poeme' ? splitLines(d.raw) : splitSentences(d.raw);
  var n = learnIdxArr(lines), blocks = 1;
  if (!n) return 'Rien pour l\'instant.';
  for (var i = 0; i < lines.length; i++) if (lines[i] === '') blocks++;
  return n + ' ' + KINDS[d.kind].unit + ' · ' + blocks + ' ' + (d.kind === 'poeme' ? 'strophe(s)' : 'paragraphe(s)');
}

/* =========================================================
   ACTIONS
   ========================================================= */
var ACT = {};
function curT(){ return getT(V.p.id); }
ACT.back = function(){
  if (TAB_VIEWS[V.name]) return;
  if (V.name === 'loge' || (V.name === 'editor' && !V.p.id)) go(LASTTAB);
  else if (V.name === 'editor') go('loge', { id:V.p.id });
  else go('loge', { id:V.p.id });
};
ACT.open = function(el){ go('loge', { id: el.getAttribute('data-id') }); };
ACT.newText = function(){ go('editor', {}); };
ACT.edit = function(el){ go('editor', { id: el.getAttribute('data-id') }); };
ACT.mode = function(el){
  var m = el.getAttribute('data-m'), t = curT(); if (!t) return;
  if (m === 'veille'){
    if (t.kind === 'lecon'){
      var weak = []; for (var i = 0; i < t.cards.length; i++){ if ((t.cards[i].box || 1) <= 2) weak.push(i); }
      go('lgenerale', { id:t.id, subset: weak.length ? weak : null });
    } else {
      var L = learnIdx(t), wl = [];
      for (var j = 0; j < L.length; j++){ if ((t.strength[L[j]] || 0) < 2) wl.push(L[j]); }
      if (!wl.length || wl.length === L.length) go('generale', { id:t.id });
      else go('generale', { id:t.id, subset:wl });
    }
    return;
  }
  go(m, { id:t.id });
};
/* lecture */
ACT.readAll = function(){ var t = curT(); readFrom(t, 0, true); };
ACT.stopRead = function(){ stopSpeak(); };
ACT.readLine = function(el){ var t = curT(); readTok++; var i = +el.getAttribute('data-i'); clearHL(); el.className += ' hl'; var tok = readTok; speak(readItems(t)[i], t.lang, function(){ if (tok === readTok) clearHL(); }); };
ACT.readDone = function(){ var t = curT(); award(t, 'lu'); practiced(t); save(); toast('Lecture validée !'); go('loge', { id:t.id }); };
/* vers par vers */
ACT.chain = function(el){
  var t = curT(), d = el.getAttribute('data-do'), N = learnIdx(t).length, p = V.p;
  if (d === 'hide'){ stopSpeak(); p.ph = 'test'; }
  else if (d === 'check') p.ph = 'check';
  else if (d === 'again') p.ph = 'learn';
  else if (d === 'ok'){
    if (p.k >= N){ p.ph = 'done'; t.chainPos = 1; award(t, 'repete'); practiced(t); }
    else { p.k++; p.ph = 'learn'; t.chainPos = p.k; }
    save();
  }
  else if (d === 'restart'){ p.k = 1; p.ph = 'learn'; t.chainPos = 1; save(); }
  else if (d === 'listen'){ speak(t.lines[learnIdx(t)[p.k-1]], t.lang); return; }
  render(); try { window.scrollTo(0,0); } catch(e){}
};
/* effacement */
ACT.setLv = function(el){ V.p.lv = +el.getAttribute('data-lv'); render(); };
ACT.peek = function(el){
  if (/peeked/.test(el.className)) return;
  el.className += ' peeked'; V.p.souf = (V.p.souf || 0) + 1;
};
ACT.effOk = function(){
  var t = curT(), lv = V.p.lv;
  if (lv >= 3){ award(t, 'repete'); }
  practiced(t);
  if (lv < 4){ V.p.lv = lv + 1; t.effLevel = V.p.lv; V.p.souf = 0; save(); render(); try { window.scrollTo(0,0); } catch(e){} toast('Niveau suivant : ' + LEVELS[V.p.lv]); }
  else {
    t.effLevel = 4; save();
    if (NEWSTARS.length) flushStars();
    else openModal('<h2>' + ic('mask') + 'Rideau fermé… et tu sais tout !</h2><p>Il est temps de passer à <b>la générale</b> pour le prouver.</p><button class="btn gold big" data-act="mode" data-m="' + (t.kind === 'lecon' ? 'lgenerale' : 'generale') + '">' + ic('clapper') + 'Tenter la générale</button><button class="btn ghost big" data-act="close">Plus tard</button>');
  }
};
/* générale */
ACT.dictate = function(){ toggleDictation(curT()); };
ACT.souffleur = function(){
  var t = curT(), L = V.p.subset && V.p.subset.length ? V.p.subset : learnIdx(t);
  var ta = document.getElementById('gen'), typed = ta ? ta.value : '';
  var n = typed.split('\n').filter(function(l){ return l.replace(/\s/g,'') !== ''; }).length;
  var box = document.getElementById('souf');
  if (n >= L.length){ if (box) box.innerHTML = '<div class="souffleur">' + ic('bulb') + 'Tu as déjà écrit autant de lignes que le texte en compte !</div>'; return; }
  var ws = splitWords(t.lines[L[n]]);
  V.p.souf = (V.p.souf || 0) + 1;
  if (box) box.innerHTML = '<div class="souffleur">' + ic('bulb') + 'Ligne ' + (n+1) + ' : « ' + esc(ws.slice(0, 2).join(' ')) + ' … »</div>';
};
ACT.genCheck = function(){
  var t = curT(), p = V.p, ta = document.getElementById('gen');
  p.draft = ta ? ta.value : (p.draft || '');
  if (p.draft.replace(/\s/g,'') === ''){ toast('Écris (ou dicte) ta récitation d\'abord !'); return; }
  stopDictation();
  var L = p.subset && p.subset.length ? p.subset : learnIdx(t);
  var r = compareText(t.lines, L, p.draft);
  for (var li in r.perLine){
    var pl = r.perLine[li], i = +li;
    if (pl.tot && pl.ok / pl.tot >= 0.9) t.strength[i] = Math.min((t.strength[i] || 0) + 1, 3);
    else t.strength[i] = 0;
  }
  p.res = r;
  recordSession(t, p.subset ? 'veille' : 'generale', r.score);
  render(); try { window.scrollTo(0,0); } catch(e){}
};
ACT.genRestart = function(){ var t = curT(); go('generale', { id:t.id }); };
ACT.redoWeak = function(){ var t = curT(); var w = weakLines(t, V.p.res); go('generale', { id:t.id, subset:w }); };
/* enregistrement */
ACT.record = function(){ toggleRecord(curT()); };
ACT.toggleShow = function(){ V.p.show = !V.p.show; render(); };
/* questions */
ACT.qShow = function(){ V.p.shown = true; render(); };
ACT.qSpeak = function(){ var t = curT(); speak(t.cards[V.p.queue[V.p.pos]].q, t.lang); };
ACT.qRate = function(el){
  var t = curT(), p = V.p, r = +el.getAttribute('data-r'), ci = p.queue[p.pos], c = t.cards[ci];
  if (r === 2){ c.box = Math.min((c.box || 1) + 1, 5); p.res.ok++; }
  else if (r === 1){ c.box = Math.max(1, (c.box || 1)); p.res.mid++; }
  else { c.box = 1; p.res.ko++; if (!p.retried[ci]){ p.retried[ci] = true; p.queue.push(ci); } }
  p.pos++; p.shown = false;
  if (p.pos >= p.queue.length){ award(t, 'repete'); practiced(t); }
  save(); render();
};
/* générale leçon */
ACT.lCheck = function(){ var ta = document.getElementById('lans'); V.p.ans = ta ? ta.value : ''; V.p.ph = 'check'; render(); };
ACT.lRate = function(el){
  var t = curT(), p = V.p, ok = el.getAttribute('data-r') === '1', c = t.cards[p.list[p.pos]];
  if (ok){ p.ok++; c.box = Math.min((c.box || 1) + 1, 5); } else c.box = 1;
  p.pos++; p.ph = 'ask'; p.ans = '';
  if (p.pos >= p.list.length){ recordSession(t, p.subset ? 'veille' : 'generale', Math.round(p.ok / p.list.length * 100)); }
  else save();
  render(); try { window.scrollTo(0,0); } catch(e){}
};
/* éditeur */
ACT.setKind = function(el){
  var d = V.p.d, nk = el.getAttribute('data-k');
  if (d.kind === nk) return;
  if (V.p.id){ var t = getT(V.p.id); if ((t.kind === 'lecon') !== (nk === 'lecon')){ toast('Pour changer de type, crée plutôt un nouveau texte'); return; } }
  d.kind = nk; render();
};
ACT.addCard = function(){ V.p.d.cards.push({ q:'', a:'' }); render(); };
ACT.delCard = function(el){ V.p.d.cards.splice(+el.getAttribute('data-ci'), 1); if (!V.p.d.cards.length) V.p.d.cards.push({ q:'', a:'' }); render(); };
ACT.toggleBulk = function(){ V.p.bulk = !V.p.bulk; render(); };
ACT.bulkAdd = function(){
  var ta = document.getElementById('bulk'); if (!ta) return;
  var lines = ta.value.replace(/\r/g,'').split('\n'), added = 0, d = V.p.d;
  d.cards = d.cards.filter(function(c){ return (c.q + c.a).replace(/\s/g,'') !== ''; });
  for (var i = 0; i < lines.length; i++){
    var l = lines[i].replace(/^\s+|\s+$/g,''); if (!l) continue;
    var q, a, pos = l.indexOf('|');
    if (pos < 0) pos = l.indexOf('\t');
    if (pos >= 0){ q = l.slice(0, pos); a = l.slice(pos + 1); }
    else { var qi = l.indexOf('?'); if (qi >= 0){ q = l.slice(0, qi + 1); a = l.slice(qi + 1); } else { q = l; a = ''; } }
    q = q.replace(/^\s+|\s+$/g,''); a = a.replace(/^\s+|\s+$/g,'');
    if (q){ d.cards.push({ q:q, a:a }); added++; }
  }
  if (!d.cards.length) d.cards.push({ q:'', a:'' });
  V.p.bulk = false; render(); toast(added + ' question(s) ajoutée(s)');
};
ACT.saveText = function(){
  var d = V.p.d, err = document.getElementById('err');
  d.title = String(d.title).replace(/^\s+|\s+$/g,'');
  if (!d.title){ err.textContent = 'Donne un titre à ton texte.'; return; }
  var lines = [], cards = [], i;
  if (d.kind === 'lecon'){
    for (i = 0; i < d.cards.length; i++){
      var q = String(d.cards[i].q).replace(/^\s+|\s+$/g,''), a = String(d.cards[i].a).replace(/^\s+|\s+$/g,'');
      if (q && a) cards.push({ q:q, a:a });
      else if (q || a){ err.textContent = 'La question ' + (i+1) + ' doit avoir une question ET une réponse.'; return; }
    }
    if (!cards.length){ err.textContent = 'Ajoute au moins une question avec sa réponse.'; return; }
  } else {
    lines = d.kind === 'poeme' ? splitLines(d.raw) : splitSentences(d.raw);
    if (!learnIdxArr(lines)){ err.textContent = 'Colle ou écris ton texte.'; return; }
  }
  var t;
  if (V.p.id){
    t = getT(V.p.id);
    var changed = t.lines.join('\n') !== lines.join('\n');
    t.kind = d.kind; t.title = d.title; t.author = d.author; t.subject = d.subject; t.lang = d.lang; t.due = d.due;
    if (d.kind === 'lecon'){
      var old = {}; for (i = 0; i < t.cards.length; i++) old[t.cards[i].q] = t.cards[i].box;
      t.cards = cards.map(function(c){ return { q:c.q, a:c.a, box: old[c.q] || 1 }; });
    } else if (changed){ t.lines = lines; t.strength = []; t.chainPos = 1; t.effLevel = 0; }
    fixStrength(t);
    if (t.lastPractice) t.nextReview = computeNext(t);
  } else {
    t = makeText({ kind:d.kind, title:d.title, author:d.author, subject:d.subject, lang:d.lang, due:d.due, lines:lines, cards:cards, color: S.texts.length % COLORS.length });
    S.texts.push(t);
  }
  save(); toast('« ' + t.title + ' » est à l\'affiche !');
  go('loge', { id:t.id });
};
/* partage */
ACT.share = function(el){
  var t = getT(el.getAttribute('data-id')), link = shareLink(t), code = shareCode(t);
  var h = '<h2>' + ic('share') + 'Partager « ' + esc(t.title) + ' »</h2><p>Idéal pour un prof qui envoie le texte à toute sa classe (ENT, Pronote, mail…). Seul le texte est partagé, pas tes étoiles.</p>';
  if (link) h += '<label class="f">Le lien</label><div class="codebox">' + esc(link) + '</div><button class="btn gold big" data-act="copy" data-what="link">' + ic('copy') + 'Copier le lien</button>';
  h += '<label class="f">Le code (si le lien ne s\'ouvre pas)</label><div class="codebox">' + esc(code) + '</div><button class="btn ghost big" data-act="copy" data-what="code">' + ic('copy') + 'Copier le code</button>';
  h += '<p class="small muted">L\'élève ouvre le lien, ou touche « J\'ai reçu un code » sur l\'accueil et le colle.' + (code.length > 6000 ? ' Ce texte est long : préfère le code au lien.' : '') + '</p><button class="btn ghost big" data-act="close">Fermer</button>';
  SHARE = { link:link, code:code };
  openModal(h);
};
var SHARE = null;
ACT.copy = function(el){ var w = el.getAttribute('data-what'); copyText(w === 'link' ? SHARE.link : SHARE.code, 'Copié !'); };
ACT.receive = function(){
  openModal('<h2>' + ic('inbox') + 'J\'ai reçu un texte</h2><p>Colle ici le code ou le lien envoyé par ton professeur.</p><textarea id="recvCode" class="short" placeholder="B2Y…"></textarea><div class="err" id="recvErr"></div><button class="btn gold big" data-act="recvGo">Ouvrir</button><button class="btn ghost big" data-act="close">Annuler</button>');
};
ACT.recvGo = function(){
  var v = (document.getElementById('recvCode') || {}).value || '', d = parseShare(v);
  if (!d){ document.getElementById('recvErr').textContent = 'Ce code n\'est pas reconnu. Vérifie que tu l\'as copié en entier.'; return; }
  askImport(d);
};
ACT.doImport = function(){
  if (!PENDING) return closeModal();
  var due = (document.getElementById('impDue') || {}).value || '';
  var d = PENDING; d.due = due; d.color = S.texts.length % COLORS.length;
  var t = makeText(d); S.texts.push(t); save(); PENDING = null; closeModal();
  toast('Texte ajouté à tes affiches !'); go('loge', { id:t.id });
};
/* suppression / remise à zéro */
ACT.delText = function(el){
  var t = getT(el.getAttribute('data-id'));
  openModal('<h2>' + ic('trash') + 'Supprimer « ' + esc(t.title) + ' » ?</h2><p>Le texte et toutes ses étoiles disparaîtront.</p><button class="btn bad big" data-act="delYes" data-id="' + t.id + '">Oui, supprimer</button><button class="btn ghost big" data-act="close">Non, garder</button>');
};
ACT.delYes = function(el){
  var id = el.getAttribute('data-id');
  S.texts = S.texts.filter(function(x){ return x.id !== id; }); save(); closeModal(); go('home'); toast('Affiche décrochée');
};
ACT.resetText = function(el){
  var t = getT(el.getAttribute('data-id'));
  openModal('<h2>' + ic('restart') + 'Repartir de zéro ?</h2><p>Tu gardes le texte, mais ses étoiles, son historique et ses répétitions sont effacés. Pratique pour réapprendre un texte des mois plus tard.</p><button class="btn bad big" data-act="resetYes" data-id="' + t.id + '">Oui, tout reprendre</button><button class="btn ghost big" data-act="close">Annuler</button>');
};
ACT.resetYes = function(el){
  var t = getT(el.getAttribute('data-id'));
  t.stars = { lu:false, repete:false, generale:false, premiere:false }; t.sessions = []; t.stage = 0; t.nextReview = ''; t.lastPractice = ''; t.firstPerfect = ''; t.chainPos = 1; t.effLevel = 0; t.strength = [];
  for (var i = 0; i < t.cards.length; i++) t.cards[i].box = 1;
  fixStrength(t); save(); closeModal(); render();
};
/* modales génériques */
ACT.close = function(){ closeModal(); };
ACT.closeStar = function(){ closeModal(); if (NEWSTARS.length) flushStars(); else if (NAV_VIEWS[V.name]) render(); };
ACT.help = function(){
  openModal('<h2>' + ic('help') + 'Comment ça marche ?</h2>' +
    '<p><b>1. Mets ton texte à l\'affiche.</b> Poème, texte à réciter ou leçon : colle-le, et indique la date de passage.</p>' +
    '<p><b>2. Répète petit à petit.</b> Lecture, puis vers par vers, puis effacement : le texte disparaît jusqu\'au rideau fermé.</p>' +
    '<p><b>3. Passe la générale.</b> Récite sans regarder (à l\'écrit ou au micro). L\'appli te montre ce qui manque.</p>' +
    '<p><b>4. Reviens les jours suivants.</b> L\'appli te dit quand répéter : un peu chaque jour vaut mieux que tout la veille. La veille du contrôle, le mode veille cible ce que tu ne sais pas encore.</p>' +
    '<p>Chaque étoile gagnée fait entrer un spectateur dans ta salle.</p>' +
    '<h3>Pour les professeurs</h3><p class="small">Créez le texte, puis « Partager » : envoyez le lien ou le code à la classe. Chaque élève l\'ajoute dans sa propre appli. Aucune donnée ne quitte l\'appareil des élèves.</p>' +
    '<button class="btn gold big" data-act="close">C\'est parti !</button>');
};
ACT.settings = function(){
  var s = S.settings;
  function seg(key, opts){ var h = '<div class="seg">'; for (var i = 0; i < opts.length; i++) h += '<button class="' + (s[key] === opts[i][0] ? 'on' : '') + '" data-act="setS" data-k="' + key + '" data-v="' + opts[i][0] + '">' + esc(opts[i][1]) + '</button>'; return h + '</div>'; }
  openModal('<h2>' + ic('gear') + 'Réglages</h2>' +
    '<label class="f">Police</label>' + seg('font', [['std','Standard'],['lexend','Lexend (DYS)']]) +
    '<label class="f">Taille du texte</label>' + seg('size', [[1,'Normale'],[2,'Grande'],[3,'Très grande']]) +
    '<label class="f">Espacement des lignes</label>' + seg('spacing', [[1,'Normal'],[2,'Aéré']]) +
    '<label class="f">Vitesse de la voix</label>' + seg('rate', [[0.7,'Lente'],[0.9,'Normale'],[1.1,'Rapide']]) +
    '<label class="f">Applaudissements</label>' + seg('sound', [[1,'Avec le son'],[0,'Sans le son']]) +
    '<hr class="sep">' +
    '<button class="btn ghost big" data-act="diagImg">' + ic('eye') + 'Diagnostic des images</button>' +
    '<button class="btn ghost big" data-act="reloadDemo">' + ic('ticket') + 'Remettre les textes d\'exemple</button>' +
    '<button class="btn ghost big" data-act="wipe">' + ic('broom') + 'Tout effacer</button>' +
    '<button class="btn gold big" data-act="close">Fermer</button>');
};
ACT.setS = function(el){
  var k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
  S.settings[k] = (k === 'font') ? v : +v; save(); applySettings(); ACT.settings();
};
ACT.reloadDemo = function(){
  var have = {}; for (var i = 0; i < S.texts.length; i++) have[S.texts[i].title] = true;
  var before = S.texts.length;
  for (var j = 0; j < DEMO.length; j++){
    if (have[DEMO[j].title]) continue;
    var d = DEMO[j];
    S.texts.push(makeText({ kind:d.kind, title:d.title, author:d.author, subject:d.subject, lang:d.lang, color:d.color, lines:d.lines, cards:d.cards, due:(d.dueIn != null ? addDays(today(), d.dueIn) : '') }));
  }
  save(); closeModal(); go('home'); toast((S.texts.length - before) + ' texte(s) d\'exemple ajouté(s)');
};
ACT.wipe = function(){
  openModal('<h2>' + ic('broom') + 'Tout effacer ?</h2><p>Tous tes textes et toutes tes étoiles seront supprimés de cet appareil. Fais une sauvegarde avant si tu hésites.</p><button class="btn bad big" data-act="wipeYes">Oui, tout effacer</button><button class="btn ghost big" data-act="close">Annuler</button>');
};
ACT.wipeYes = function(){ S.texts = []; save(); closeModal(); go('home'); };
/* sauvegarde */
ACT.backup = function(){
  openModal('<h2>' + ic('save') + 'Sauvegarde</h2><p>Tes textes et tes étoiles sont gardés dans ce navigateur. Pour les retrouver sur un autre appareil, ou ne rien perdre si l\'historique est effacé, fais une sauvegarde.</p>' +
    '<button class="btn gold big" data-act="exportFile">' + ic('download') + 'Télécharger ma sauvegarde</button>' +
    '<button class="btn ghost big" data-act="exportCopy">' + ic('copy') + 'Copier ma sauvegarde (texte)</button>' +
    '<button class="btn ghost big" data-act="importFile">' + ic('upload') + 'Charger une sauvegarde (fichier)</button>' +
    '<label class="f" style="margin-top:10px">… ou colle une sauvegarde copiée</label><textarea id="impTxt" class="short"></textarea><div class="err" id="impErr"></div><button class="btn ghost big" data-act="importTxt">Charger ce texte</button>' +
    '<button class="btn ghost big" data-act="close">Fermer</button>');
};
function backupJSON(){ return JSON.stringify({ app:'par-coeur', v:1, date:today(), texts:S.texts }); }
ACT.exportFile = function(){
  try {
    var blob = new Blob([backupJSON()], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'par-coeur-sauvegarde-' + today() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('Sauvegarde téléchargée (si rien ne se passe, utilise « Copier »)');
  } catch(e){ toast('Téléchargement impossible ici : utilise « Copier »'); }
};
ACT.exportCopy = function(){ copyText(backupJSON(), 'Sauvegarde copiée : colle-la dans une note ou un mail'); };
ACT.importFile = function(){ document.getElementById('importFile').click(); };
ACT.importTxt = function(){ var v = (document.getElementById('impTxt') || {}).value || ''; if (!importBackup(v)) document.getElementById('impErr').textContent = 'Ce texte n\'est pas une sauvegarde de Par Cœur !'; };
function importBackup(txt){
  var o; try { o = JSON.parse(txt); } catch(e){ return false; }
  if (!o || (o.app !== 'par-coeur' && o.app !== 'les-coulisses') || !o.texts) return false;
  var map = {}, i, added = 0, upd = 0;
  for (i = 0; i < S.texts.length; i++) map[S.texts[i].id] = i;
  for (i = 0; i < o.texts.length; i++){
    var t = o.texts[i]; if (!t || !t.id || !t.title) continue;
    fixStrength(t); if (!t.stars) t.stars = { lu:false, repete:false, generale:false, premiere:false }; if (!t.sessions) t.sessions = [];
    if (map[t.id] != null){ S.texts[map[t.id]] = t; upd++; } else { S.texts.push(t); added++; }
  }
  save(); closeModal(); go('home'); toast('Sauvegarde chargée : ' + added + ' ajouté(s), ' + upd + ' mis à jour');
  return true;
}
document.getElementById('importFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){ if (!importBackup(String(r.result))) toast('Fichier non reconnu'); };
  r.readAsText(f); e.target.value = '';
});

/* ---------------- écouteurs globaux ---------------- */
document.addEventListener('click', function(e){
  var el = e.target;
  while (el && el !== document && !(el.getAttribute && el.getAttribute('data-act'))) el = el.parentNode;
  if (!el || el === document){ if (e.target === modalEl) closeModal(); return; }
  var a = el.getAttribute('data-act');
  if (ACT[a]) ACT[a](el, e);
});
document.addEventListener('input', function(e){
  var el = e.target, b = el.getAttribute && el.getAttribute('data-bind');
  if (!b) return;
  if (b === 'draft') V.p.draft = el.value;
  else if (b === 'ans') V.p.ans = el.value;
  else if (b === 'card'){ V.p.d.cards[+el.getAttribute('data-ci')][el.getAttribute('data-f')] = el.value; }
  else if (b.indexOf('d.') === 0){
    V.p.d[b.slice(2)] = el.value;
    if (b === 'd.raw'){ var pv = document.getElementById('preview'); if (pv) pv.textContent = previewTxt(V.p.d); }
  }
  if (el.id === 'rate'){ S.settings.rate = +el.value; save(); }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.id === 'rate'){ S.settings.rate = +el.value; save(); }
  var b = el.getAttribute && el.getAttribute('data-bind');
  if (b && b.indexOf('d.') === 0) V.p.d[b.slice(2)] = el.value;
});
document.addEventListener('keydown', function(e){ if ((e.key === 'Escape' || e.keyCode === 27) && !/hidden/.test(modalEl.className)) closeModal(); });
if (hasTTS && window.speechSynthesis.onvoiceschanged !== undefined){ window.speechSynthesis.onvoiceschanged = function(){}; }

/* ---------------- navigation ---------------- */
ACT.tab = function(el){ closeModal(); go(el.getAttribute('data-tab')); };
window.b2yImgNext = function(el){
  var src = el.getAttribute('src'), m = src.match(/\.(webp|png|jpg)$/), order = ['webp','png','jpg'];
  var i = m ? order.indexOf(m[1]) : 2;
  if (i < 2) el.setAttribute('src', src.replace(/\.(webp|png|jpg)$/, '.' + order[i + 1]));
  else if (el.parentNode) el.parentNode.removeChild(el);
};
var IMG_LIST = [['scene','Fond de l\'accueil'],['salle','Fond de la salle'],['affiche','Texture des affiches'],['trophee-bronze','Trophée bronze'],['trophee-argent','Trophée argent'],['trophee-or','Trophée or'],['etoile','Trophée Légende']];
ACT.diagImg = function(){
  var h = '<h2>' + ic('eye') + 'Diagnostic des images</h2><p class="small muted">L\'appli cherche chaque image dans le dossier <b>img/</b> (en minuscules), à côté du fichier index.html, en .webp, .png ou .jpg.</p><ul class="diag" style="list-style:none;padding:0;margin:0">';
  for (var i = 0; i < IMG_LIST.length; i++) h += '<li><span><b>' + IMG_LIST[i][1] + '</b><br><small class="muted">img/' + IMG_LIST[i][0] + '.webp</small></span><span id="dg' + i + '" class="muted">…</span></li>';
  openModal(h + '</ul><p class="small muted">Adresse de la page : ' + esc(String(location.href).split('#')[0]) + '</p><button class="btn gold big" data-act="close">Fermer</button>');
  function test(i, k){
    var exts = ['webp','png','jpg'], im = new Image();
    im.onload = function(){ var el = document.getElementById('dg' + i); if (el){ el.className = 'y'; el.textContent = 'trouvée (.' + exts[k] + ')'; } };
    im.onerror = function(){ if (k < 2) test(i, k + 1); else { var el = document.getElementById('dg' + i); if (el){ el.className = 'n'; el.textContent = 'introuvable'; } } };
    im.src = 'img/' + IMG_LIST[i][0] + '.' + exts[k] + '?t=' + Date.now();
  }
  for (var j = 0; j < IMG_LIST.length; j++) test(j, 0);
};
ACT.nextPractice = function(){ var t = prioritized(); if (t) go('loge', { id:t.id }); else if (S.texts.length) go('texts'); else go('editor', {}); };

/* ---------------- démarrage ---------------- */
applySettings();
render();
(function(){
  var h = String(location.hash || '');
  if (h.indexOf('B2Y') >= 0){
    var d = parseShare(h);
    try { history.replaceState(null, '', String(location.href).split('#')[0]); } catch(e){}
    if (d) askImport(d); else toast('Lien de partage incomplet');
  }
})();

})();
</script>
