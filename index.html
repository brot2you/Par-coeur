<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Par Cœur ! — apprends tes textes et tes leçons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lexend:wght@400;600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--velvet:#8b1428;--velvet-d:#55091a;--gold:#f2c14e;--gold-d:#c48a1e;--cream:#fbf3e4;--paper:#fffdf8;--ink:#2a1a14;--muted:#7a6255;--ok:#23854f;--warn:#c77400;--bad:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100vh}
body.f-lexend{font-family:'Lexend',system-ui,sans-serif;letter-spacing:.02em;word-spacing:.12em}
body.s2{font-size:19px}
body.s3{font-size:22px}
.display,h1,h2{font-family:'Abril Fatface',Georgia,serif;font-weight:400}
body.f-lexend .display,body.f-lexend h2,body.f-lexend .p-title,body.f-lexend .tt,body.f-lexend .score{font-family:'Lexend',sans-serif;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--velvet)}
.wrap{max-width:780px;margin:0 auto;padding:16px 14px 48px}
.hidden{display:none!important}
.small{font-size:.85em}
.muted{color:var(--muted)}
.center{text-align:center}
/* ---------- rideau ---------- */
.curtain{position:relative;background:repeating-linear-gradient(90deg,#6a0e1f 0,#a01a31 22px,#7c1226 44px);color:#fff;text-align:center;padding:44px 14px 30px;overflow:hidden;box-shadow:inset 0 -12px 22px rgba(0,0,0,.35)}
.curtain:before{content:'';position:absolute;left:0;right:0;top:0;height:30px;background:radial-gradient(circle at 50% 0,#f2c14e 0,#f2c14e 15px,transparent 16px) 0 0/44px 30px repeat-x;pointer-events:none}
.topbtns{position:absolute;right:10px;top:34px;z-index:2}
.topbtns .icon-btn{margin-left:6px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.38);border:2px solid rgba(242,193,78,.65);color:#fff;border-radius:12px;width:42px;height:42px;font-size:19px;padding:0}
.marquee{position:relative;display:inline-block;background:#24140e;border:4px solid var(--gold);border-radius:16px;padding:12px 24px 10px;margin-top:44px;box-shadow:0 10px 26px rgba(0,0,0,.45);max-width:92%}
.marquee:before{content:'';position:absolute;top:-13px;left:-13px;right:-13px;bottom:-13px;border:5px dotted #ffe7a0;border-radius:24px;animation:blink 1.4s steps(2) infinite;pointer-events:none}
@keyframes blink{50%{border-color:#f29a3a}}
.marquee h1{margin:0;font-size:2.3em;line-height:1.05;color:var(--gold);text-shadow:0 0 14px rgba(242,193,78,.55)}
.marquee p{margin:4px 0 0;font-weight:800;color:#ffe9c2;font-size:.95em}
.brand{margin-top:18px;font-size:.72em;letter-spacing:.22em;color:#ffd9a0;opacity:.9;font-weight:800}
/* ---------- barre du haut ---------- */
.topbar{position:-webkit-sticky;position:sticky;top:0;z-index:5;background:linear-gradient(#7c1226,#5e0d1d);color:#fff;display:flex;align-items:center;padding:10px 12px;box-shadow:0 3px 10px rgba(0,0,0,.25);border-bottom:3px solid var(--gold)}
.topbar .back{background:rgba(0,0,0,.25);border:2px solid rgba(242,193,78,.75);border-radius:12px;color:#fff;padding:6px 12px;font-weight:800;white-space:nowrap}
.topbar .tt{flex:1;text-align:center;font-family:'Abril Fatface',Georgia,serif;font-size:1.15em;margin:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{width:70px}
/* ---------- éléments ---------- */
.card{background:var(--paper);border-radius:18px;padding:16px;margin:0 0 16px;box-shadow:0 2px 0 #e7d6bb,0 8px 22px rgba(80,40,10,.08);border:1px solid #efe1c8}
h2.sec{font-size:1.35em;margin:24px 4px 10px;color:var(--velvet-d)}
h3{margin:0 0 8px;color:var(--velvet-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--velvet);color:#fff;box-shadow:0 4px 0 var(--velvet-d);margin:4px 6px 6px 0;min-height:48px;text-align:center;line-height:1.2}
.btn:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 var(--velvet-d)}
.btn.gold{background:var(--gold);color:#3a2000;box-shadow:0 4px 0 var(--gold-d)}
.btn.ghost{background:#f3e6cf;color:var(--ink);box-shadow:0 4px 0 #dcc7a2}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #17603a}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #8e2a20}
.btn.big{width:100%;font-size:1.1em;padding:16px;margin-right:0}
.btn.half{width:calc(50% - 4px);margin-right:0}
.btn.half+.btn.half{margin-left:8px}
.btn.on{background:#d63031}
.row{display:flex;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center}
/* ---------- théâtre ---------- */
.theatre{background:linear-gradient(#2b1711,#3d2016);color:#fff;border:none;overflow:hidden;padding-bottom:0}
.theatre .muted{color:#d9b99a}
.th-top{display:flex;justify-content:space-between;align-items:flex-start}
.rank{font-size:1.5em;color:var(--gold);line-height:1.15;margin:2px 0}
.starcount{background:var(--gold);color:#3a2000;font-weight:900;border-radius:999px;padding:6px 14px;font-size:1.1em;white-space:nowrap;margin-left:8px}
.seats{display:flex;flex-wrap:wrap;justify-content:center;max-width:362px;margin:14px auto 0}
.seat{width:29px;height:29px;margin:3px;border-radius:9px 9px 4px 4px;background:#6f1022;box-shadow:inset 0 -6px 0 #4a0814;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.seat.on{background:#a01a31;-webkit-animation:pop .5s ease both;animation:pop .5s ease both}
.stage-floor{height:20px;margin:14px -16px 0;background:repeating-linear-gradient(90deg,#7a4a2a 0,#8d5a34 40px,#6b3e22 80px);border-top:4px solid var(--gold)}
/* ---------- à l'affiche ce soir ---------- */
.todo{display:flex;align-items:center;background:var(--paper);border-radius:16px;padding:12px;margin:0 0 10px;border:none;border-left:8px solid var(--pc,#a8182e);box-shadow:0 2px 8px rgba(80,40,10,.1);width:100%;text-align:left}
.todo .ic{font-size:1.6em;margin-right:12px}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .go{font-weight:900;color:var(--velvet);margin-left:8px;white-space:nowrap}
.relache{text-align:center;padding:18px;color:var(--muted)}
/* ---------- affiches ---------- */
.posters{display:flex;flex-wrap:wrap;margin:0 -6px}
.poster{position:relative;width:calc(50% - 12px);margin:6px;min-height:196px;border:none;border-radius:10px;padding:16px 12px 14px;background-color:var(--pc,#a8182e);background-image:linear-gradient(rgba(255,255,255,.1),rgba(0,0,0,.2));color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:0 6px 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.15)}
.poster:before{content:'';position:absolute;top:6px;left:6px;right:6px;bottom:6px;border:2px solid rgba(255,255,255,.55);border-radius:6px;pointer-events:none}
@media (min-width:620px){.poster{width:calc(33.333% - 12px)}}
.p-kind{font-size:.7em;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.92}
.p-title{font-family:'Abril Fatface',Georgia,serif;font-size:1.25em;line-height:1.15;margin:8px 0 4px;word-break:break-word}
.p-author{font-style:italic;font-size:.85em;opacity:.92}
.p-stars{margin-top:8px;font-size:1.05em;letter-spacing:2px}
.p-due{margin-top:6px;background:rgba(0,0,0,.35);border-radius:999px;padding:2px 10px;font-size:.78em;font-weight:800}
.p-due.soon{background:var(--gold);color:#3a2000}
.poster.new{background:transparent;color:var(--velvet);border:3px dashed #d9b98f;box-shadow:none;justify-content:center;font-weight:900}
.poster.new:before{display:none}
.poster.new .plus{font-size:2.6em;line-height:1}
.poster.big{width:auto;margin:0 0 14px;min-height:0;padding:24px 16px 20px;display:block}
.poster.big .p-title{font-size:1.7em;display:block}
.poster.big .p-meta{display:block;font-size:.85em;margin-top:6px;opacity:.92}
/* ---------- loge ---------- */
.infos{display:flex;margin:0 -5px 14px}
.info{flex:1;margin:0 5px;background:var(--paper);border-radius:14px;padding:10px 6px;text-align:center;border:1px solid #efe1c8}
.info b{display:block;font-size:1.1em;color:var(--velvet)}
.info span{font-size:.75em;color:var(--muted)}
.veille{background:#20123a;color:#fff;border:none}
.veille b{color:#ffd86b}
.modes{display:flex;flex-wrap:wrap;margin:0 -5px}
.mode{width:calc(50% - 10px);margin:5px;background:var(--paper);border:2px solid #efdfc3;border-radius:16px;padding:14px 12px;text-align:left;box-shadow:0 4px 0 #e5d2b0}
.mode:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 1px 0 #e5d2b0}
.mode .mi{font-size:1.8em;display:block;line-height:1.1}
.mode b{display:block;font-size:1.02em;margin:5px 0 2px;color:var(--velvet-d)}
.mode .d{font-size:.82em;color:var(--muted);display:block}
.mode.hero{width:calc(100% - 10px);background:var(--gold);border-color:var(--gold-d);box-shadow:0 4px 0 var(--gold-d)}
.mode.hero .d{color:#5a3a00}
.steps .st{display:flex;align-items:flex-start;padding:9px 0;border-bottom:1px dashed #ead8b8}
.steps .st:last-child{border-bottom:0}
.st .s{font-size:1.5em;margin-right:12px;line-height:1.1;-webkit-filter:grayscale(1);filter:grayscale(1);opacity:.35}
.st.on .s{-webkit-filter:none;filter:none;opacity:1}
.st b{display:block}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #ead8b8;font-size:.9em}
.hist li:last-child{border-bottom:0}
/* ---------- textes ---------- */
.reading{font-size:1.15em;line-height:1.8}
body.sp2 .reading{line-height:2.3}
.line{padding:3px 8px;border-radius:8px;margin:1px 0}
.rl{cursor:pointer}
.rl.hl{background:#ffe9a8}
.gap{height:.9em}
.line.new{font-weight:800;background:#fff1c9}
.line.faded{color:#a38b78}
.bar{display:inline-block;height:.85em;background:#e9d9bd;border-radius:6px;vertical-align:middle}
.w{white-space:nowrap}
.w.hid{cursor:pointer;color:#b09474;letter-spacing:.05em}
.w.hid .o{display:none}
.w.hid.peeked .m{display:none}
.w.hid.peeked .o{display:inline;color:var(--warn);font-weight:800;letter-spacing:0}
.qa{margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#fff6e2}
.qa .q{font-weight:800;color:var(--velvet-d)}
.levels{display:flex;margin:8px -3px 12px}
.lv{flex:1;margin:0 3px;padding:8px 2px;border-radius:10px;border:2px solid #e5d2b0;background:#fff;font-size:.72em;font-weight:800;text-align:center;line-height:1.2}
.lv.on{background:var(--velvet);color:#fff;border-color:var(--velvet)}
.progress{height:12px;border-radius:999px;background:#ecdcc0;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f59e0b);transition:width .3s}
.flash{text-align:center;padding:26px 16px;min-height:180px;display:flex;flex-direction:column;justify-content:center}
.flash .q{font-size:1.3em;font-weight:900;color:var(--velvet-d)}
.flash .a{margin-top:16px;font-size:1.1em;background:#fff1c9;border-radius:12px;padding:12px}
.stickybar{position:-webkit-sticky;position:sticky;bottom:0;z-index:4;background:linear-gradient(rgba(251,243,228,0),var(--cream) 30%);padding:14px 0 10px}
.souffleur{background:#fff4d6;border:2px dashed var(--gold-d);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700}
/* ---------- formulaires ---------- */
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid #e3cfac;background:#fff;color:var(--ink);margin:4px 0 10px;-webkit-appearance:none;appearance:none}
input[type=date]{min-height:50px}
textarea{min-height:200px;line-height:1.6;resize:vertical}
textarea.short{min-height:70px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--gold-d);box-shadow:0 0 0 3px rgba(242,193,78,.35)}
label.f{font-weight:800;font-size:.9em;color:var(--velvet-d);display:block;margin-top:4px}
.seg{display:flex;margin:4px -3px 12px}
.seg button{flex:1;margin:0 3px;padding:10px 4px;border-radius:12px;border:2px solid #e3cfac;background:#fff;font-weight:800;font-size:.85em;line-height:1.2}
.seg button.on{background:var(--velvet);border-color:var(--velvet);color:#fff}
.cardrow{background:#fff6e2;border-radius:14px;padding:10px;margin-bottom:10px;position:relative}
.cardrow .del{position:absolute;right:8px;top:6px;background:none;border:none;font-size:1.1em}
.err{color:var(--bad);font-weight:800;margin:6px 0}
input[type=range]{width:120px;vertical-align:middle}
/* ---------- résultats ---------- */
.score{font-family:'Abril Fatface',Georgia,serif;font-size:3.2em;color:var(--velvet);text-align:center;line-height:1}
.verdict{text-align:center;font-weight:900;font-size:1.15em;margin:8px 0 12px}
.r-ok{color:var(--ok)}
.r-acc{color:var(--warn);text-decoration:underline}
.r-miss{color:var(--bad);background:#fde2df;border-radius:4px;padding:0 2px}
.lmark{float:right;margin-left:6px}
.legend span{margin-right:12px;white-space:nowrap}
/* ---------- modale & toast ---------- */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(30,10,5,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:var(--paper);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 28px;-webkit-overflow-scrolling:touch;-webkit-animation:up .25s ease;animation:up .25s ease}
@media (min-width:620px){.modal{align-items:center}.modal-box{border-radius:22px}}
@-webkit-keyframes up{from{-webkit-transform:translateY(40px);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h2{margin:0 0 10px;color:var(--velvet-d)}
.toast{position:fixed;left:50%;bottom:24px;-webkit-transform:translate(-50%,140px);transform:translate(-50%,140px);background:#2a1a14;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:transform .3s;max-width:90%;text-align:center}
.toast{visibility:hidden}.toast.on{visibility:visible;-webkit-transform:translate(-50%,0);transform:translate(-50%,0)}
.celebr{text-align:center}
.celebr .bigstar{font-size:5em;display:inline-block;-webkit-animation:pop .7s ease;animation:pop .7s ease}
@-webkit-keyframes pop{0%{-webkit-transform:scale(0)}70%{-webkit-transform:scale(1.25)}100%{-webkit-transform:scale(1)}}
@keyframes pop{0%{transform:scale(0) rotate(-120deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:70;-webkit-animation:fall 2.4s linear forwards;animation:fall 2.4s linear forwards;pointer-events:none}
@-webkit-keyframes fall{to{-webkit-transform:translateY(110vh) rotate(720deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.tip{background:#fff4d6;border:2px dashed var(--gold-d);box-shadow:none}
.tip b{color:var(--velvet-d)}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:.75em;word-break:break-all;background:#f6ecd9;border-radius:10px;padding:10px;max-height:120px;overflow:auto;-webkit-user-select:all;user-select:all}
footer{text-align:center;color:var(--muted);font-size:.8em;padding:10px 14px 30px}
.recdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#fff;margin-right:8px}
.btn.on .recdot{-webkit-animation:blink 1s steps(2) infinite;animation:blink 1s steps(2) infinite;background:#ffd86b}
.take{display:flex;align-items:center;margin:8px 0}
.take span{width:80px;font-weight:800;font-size:.9em}
.take audio{flex:1;min-width:0}
</style>
</head>
<body>

<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>

<script type="application/json" id="data-tips">
[
 "Relire, ce n'est pas apprendre. Cache le texte et essaie de le redire : c'est l'effort pour retrouver les mots qui les fixe dans ta mémoire.",

/* ---------------- utilitaires ---------------- */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function pad(n){ return (n < 10 ? '0' : '') + n; }

function parseYmd(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

function isLetter(c){ return /[0-9A-Za-zÀ-ÖØ-öø-ÿŒœÆæ]/.test(c); }

function makeText(o){

}

function countUnits(t){ return t.kind === 'lecon' ? t.cards.length : learnIdx(t).length; }

function rankFor(n){ var cur = RANKS[0][1], next = null; for (var i = 0; i < RANKS.length; i++){ if (n >= RANKS[i][0]) cur = RANKS[i][1]; else { next = RANKS[i]; break; } } return { cur:cur, next:next }; }
function daysLeft(t){ return t.due ? diffDays(today(), t.due) : null; }
function dueLabel(t){
  var d = daysLeft(t); if (d === null) return '';
  if (d < 0) return 'Passé'; if (d === 0) return "C'est aujourd'hui !"; if (d === 1) return 'Demain'; return 'J-' + d;
}
function isVeille(t){ var d = daysLeft(t); return d === 0 || d === 1; }
function nextLabel(t){
  if (!t.lastPractice) return 'Maintenant';
  var d = diffDays(today(), t.nextReview || today());
  if (d <= 0) return "Aujourd'hui"; if (d === 1) return 'Demain'; return 'Dans ' + d + ' j';
}
function needsToday(t){
  var d = daysLeft(t);
  if (d !== null && d < 0 && t.stars.premiere) return false;
  if (!t.lastPractice) return true;
  if (t.lastPractice === today()) return false;
  if (d === 0 || d === 1) return true;
  return (t.nextReview || '') <= today();
}
function todoReason(t){
  var d = daysLeft(t);
  if (!t.lastPractice) return 'Première répétition';
  if (d === 0) return "Passage aujourd'hui : dernière répétition !";
  if (d === 1) return 'Passage demain : mode veille 🌙';
  return 'Répétition prévue' + (d !== null && d > 0 ? ' · passage dans ' + d + ' j' : '');
}
function computeNext(t){
  var td = today();
  var n = addDays(td, INTERVALS[Math.min(t.stage || 0, INTERVALS.length-1)]);
  if (t.due){
    var left = diffDays(td, t.due);
    if (left >= 1){
      var veille = addDays(t.due, -1);
      if (n > veille) n = (veille > td) ? veille : addDays(td, 1);
    }
  }
  return n;
}

/* ---------------- étoiles & sessions ---------------- */
var NEWSTARS = [];
function award(t, key){ if (!t.stars[key]){ t.stars[key] = true; NEWSTARS.push(key); } }
function practiced(t){
  var td = today();
  t.lastPractice = td;
  if (!t.nextReview || t.nextReview <= td) t.nextReview = computeNext(t);
}
function recordSession(t, mode, score){
  var td = today();
  t.sessions.push({ d:td, m:mode, s:score });
  if (t.sessions.length > 60) t.sessions.shift();
  if (mode === 'generale'){
    if (score >= 80) award(t, 'generale');
    if (score >= 95){
      if (t.firstPerfect && t.firstPerfect !== td) award(t, 'premiere');
      if (!t.firstPerfect) t.firstPerfect = td;
    }
    t.stage = score >= 80 ? Math.min((t.stage || 0) + 1, INTERVALS.length - 1) : Math.max((t.stage || 0) - 1, 0);
  }
  t.lastPractice = td;
  t.nextReview = computeNext(t);
  save();
}
function flushStars(){
  if (!NEWSTARS.length) return;
  var key = NEWSTARS.shift();
  var info = null;
  for (var i = 0; i < STAR_INFO.length; i++){ if (STAR_INFO[i][0] === key) info = STAR_INFO[i]; }
  if (!info) return;
  confetti();
  openModal('<div class="celebr"><div class="bigstar">⭐</div><h2>Nouvelle étoile !</h2><p><b>' + info[1] + ' ' + esc(info[2]) + '</b></p><p class="muted">Un nouveau spectateur prend place dans ton théâtre. 👏</p><button class="btn gold big" data-act="closeStar">Merci, merci !</button></div>');
}
function confetti(){

  for (var i = 0; i < 40; i++){

  }

/* ---------------- découpage & comparaison ---------------- */
function splitLines(raw){
  var arr = String(raw).replace(/\r/g,'').split('\n'), out = [], lastBlank = true;
  for (var i = 0; i < arr.length; i++){
    var l = arr[i].replace(/^\s+|\s+$/g,'');
    if (l === ''){ if (!lastBlank){ out.push(''); lastBlank = true; } }
    else { out.push(l); lastBlank = false; }
  }
  while (out.length && out[out.length-1] === '') out.pop();
  return out;
}
function splitSentences(raw){
  var paras = String(raw).replace(/\r/g,'').split(/\n\s*\n/), out = [];
  for (var p = 0; p < paras.length; p++){
    var txt = paras[p].replace(/\s+/g,' ').replace(/^\s+|\s+$/g,'');
    if (!txt) continue;
    var parts = txt.match(/[^.!?…]+[.!?…]+["»”')\]]*|[^.!?…]+$/g) || [txt];
    if (out.length) out.push('');
    for (var i = 0; i < parts.length; i++){ var s = parts[i].replace(/^\s+|\s+$/g,''); if (s) out.push(s); }
  }
  return out;
}
function joinForEdit(t){
  if (t.kind === 'poeme') return t.lines.join('\n');
  var out = '', para = [];
  for (var i = 0; i < t.lines.length; i++){
    if (t.lines[i] === ''){ out += para.join(' ') + '\n\n'; para = []; } else para.push(t.lines[i]);
  }
  return out + para.join(' ');
}
function stripAcc(s){
  s = s.replace(/œ/g,'oe').replace(/æ/g,'ae');
  if (s.normalize) s = s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  return s;
}
function ctoks(str){
  var raw = String(str).toLowerCase().replace(/[’`ʼ]/g,"'").split(/[\s'\-–—]+/), out = [];
  for (var i = 0; i < raw.length; i++){
    var a = raw[i].replace(/[^0-9a-zà-öø-ÿœæß]/g,'');
    if (a === '') continue;
    out.push({ a:a, l:stripAcc(a) });
  }
  return out;
}
function lcs(A, B){
  var n = A.length, m = B.length, W = m + 1, i, j;
  var dp = new Uint16Array((n+1)*(m+1));
  for (i = n-1; i >= 0; i--){
    for (j = m-1; j >= 0; j--){
      dp[i*W+j] = (A[i].l === B[j].l) ? dp[(i+1)*W+j+1] + 1 : Math.max(dp[(i+1)*W+j], dp[i*W+j+1]);
    }
  }
  var res = []; for (i = 0; i < n; i++) res.push(-1);
  i = 0; j = 0;
  while (i < n && j < m){
    if (A[i].l === B[j].l){ res[i] = j; i++; j++; }
    else if (dp[(i+1)*W+j] >= dp[i*W+j+1]) i++;
    else j++;
  }
  return res;
}
/* compare la récitation à la référence (lignes choisies) */
function compareText(lines, idxs, typed){
  var ref = [], words = [], i, k;
  for (i = 0; i < idxs.length; i++){
    var ws = splitWords(lines[idxs[i]]);
    for (var wi = 0; wi < ws.length; wi++){
      var w = { li:idxs[i], text:ws[wi], t:[] };
      var ct = ctoks(ws[wi]);
      for (k = 0; k < ct.length; k++){ ref.push(ct[k]); w.t.push(ref.length-1); }
      words.push(w);
    }
  }
  var hyp = ctoks(typed);
  if (hyp.length > ref.length*3 + 50) hyp = hyp.slice(0, ref.length*3 + 50);
  var m = lcs(ref, hyp), st = [], matched = 0, accents = 0;
  for (i = 0; i < ref.length; i++){
    if (m[i] < 0) st.push(0);
    else { matched++; if (ref[i].a === hyp[m[i]].a) st.push(2); else { st.push(1); accents++; } }
  }
  var perLine = {};
  for (i = 0; i < words.length; i++){
    var wd = words[i], all2 = true, any = false;
    for (k = 0; k < wd.t.length; k++){ if (st[wd.t[k]] !== 2) all2 = false; if (st[wd.t[k]] > 0) any = true; }
    wd.s = wd.t.length === 0 ? 'ok' : (all2 ? 'ok' : (any ? 'acc' : 'miss'));
    if (!perLine[wd.li]) perLine[wd.li] = { tot:0, ok:0 };
    for (k = 0; k < wd.t.length; k++){ perLine[wd.li].tot++; if (st[wd.t[k]] > 0) perLine[wd.li].ok++; }
  }
  return {
    score: ref.length ? Math.round(matched / ref.length * 100) : 0,
    words: words, perLine: perLine, accents: accents,
    extra: Math.max(0, hyp.length - matched), total: ref.length, matched: matched
  };
}

/* ---------------- masquage des mots ---------------- */
function rnd(a, b){ var x = Math.sin((a+1)*12.9898 + (b+1)*78.233) * 43758.5453; return x - Math.floor(x); }
function maskWord(w, keepFirst){
  var out = '', first = true;
  for (var i = 0; i < w.length; i++){
    var c = w.charAt(i);
    if (isLetter(c)){ out += (first && keepFirst) ? c : '_'; first = false; }
    else out += c;
  }
  return out;
}
function hidWord(w){ return '<span class="w hid" data-act="peek"><span class="m">' + esc(maskWord(w, false)) + '</span><span class="o">' + esc(w) + '</span></span>'; }
function initWord(w){ return '<span class="w hid" data-act="peek"><span class="m">' + esc(maskWord(w, true)) + '</span><span class="o">' + esc(w) + '</span></span>'; }
function effaceLine(line, li, lv){
  var ws = splitWords(line), out = [];
  for (var wi = 0; wi < ws.length; wi++){
    var w = ws[wi];
    if (lv === 0 || !/[0-9A-Za-zÀ-ÿŒœ]/.test(w)) out.push('<span class="w">' + esc(w) + '</span>');
    else if (lv === 3) out.push(initWord(w));
    else if (lv === 4) out.push(hidWord(w));
    else if (rnd(li, wi)*100 < THRESH[lv]) out.push(hidWord(w));
    else out.push('<span class="w">' + esc(w) + '</span>');
  }
  return out.join(' ');
}
function initialsLine(line){
  var ws = splitWords(line), out = [];
  for (var i = 0; i < ws.length; i++) out.push(esc(maskWord(ws[i], true)));
  return out.join(' ');
}
function barLine(line){
  var n = Math.max(3, Math.min(30, String(line).length * 0.5));
  return '<span class="bar" style="width:' + n.toFixed(1) + 'em;max-width:100%"></span>';
}

/* ---------------- synthèse vocale ---------------- */
var hasTTS = ('speechSynthesis' in window) && (typeof window.SpeechSynthesisUtterance !== 'undefined');
var readTok = 0;
function voiceFor(code){
  if (!hasTTS) return null;
  var vs = window.speechSynthesis.getVoices() || [], pre = code.slice(0,2), best = null;
  for (var i = 0; i < vs.length; i++){
    if (vs[i].lang === code || vs[i].lang === code.replace('-','_')) return vs[i];
    if (!best && vs[i].lang && vs[i].lang.slice(0,2) === pre) best = vs[i];
  }
  return best;
}
function speak(text, lang, onend){
  if (!hasTTS){ toast('🔇 Lecture audio indisponible sur cet appareil'); return; }
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text), code = ttsCode(lang), v = voiceFor(code);
  u.lang = code; if (v) u.voice = v; u.rate = S.settings.rate || 0.9;
  u.onend = function(){ if (onend) onend(); };
  window.speechSynthesis.speak(u);
}
function stopSpeak(){ readTok++; if (hasTTS) window.speechSynthesis.cancel(); clearHL(); }
function clearHL(){ var h = document.querySelectorAll('.rl.hl'); for (var i = 0; i < h.length; i++) h[i].className = h[i].className.replace(/\s?hl/g,''); }
function readItems(t){
  var r = [];
  if (t.kind === 'lecon'){ for (var i = 0; i < t.cards.length; i++){ r.push(t.cards[i].q); r.push(t.cards[i].a); } }
  else { for (var j = 0; j < t.lines.length; j++) r.push(t.lines[j]); }
  return r;
}
function readFrom(t, idx, chain){
  var items = readItems(t), tok = ++readTok;
  function step(i){
    if (tok !== readTok) return;
    while (i < items.length && String(items[i]).replace(/\s/g,'') === '') i++;
    clearHL();
    if (i >= items.length){ if (chain){ award(t, 'lu'); practiced(t); save(); flushStars(); } return; }
    var el = document.querySelector('.rl[data-i="' + i + '"]');
    if (el){ el.className += ' hl'; }
    speak(items[i], t.lang, function(){ if (chain) step(i+1); else if (tok === readTok) clearHL(); });
  }
  step(idx);
}

/* ---------------- micro : dictée & enregistrement ---------------- */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IOS_CHROME = IS_IOS && /CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
/* état de la dictée : le texte déjà présent + ce qui a été dicté pendant la session */
var DICT = { rec:null, on:false, base:'', said:'', err:'', restarts:0 };
function dictSetBtn(on){
  var b = document.getElementById('dictBtn');
  if (!b) return;
  b.className = on ? 'btn on' : 'btn ghost';
  b.innerHTML = on ? '<span class="recdot"></span>J\'écoute… touche pour arrêter' : '🎙️ Dicter';
}
function dictStatus(html){ var s = document.getElementById('dictStatus'); if (s) s.innerHTML = html || ''; }
function dictJoin(base, said){
  said = String(said).replace(/^\s+|\s+$/g,'');
  if (!said) return base;
  return base + (base && !/\n$/.test(base) ? '\n' : '') + said;
}
function dictCommit(){
  /* fige ce qui a été dit dans la zone de texte */
  var area = document.getElementById('gen');
  if (area){ area.value = dictJoin(DICT.base, DICT.said); V.p.draft = area.value; }
  DICT.base = area ? area.value : dictJoin(DICT.base, DICT.said);
  DICT.said = '';
}
function stopDictation(){
  if (!DICT.on && !DICT.rec) return;
  DICT.on = false;
  if (DICT.rec){ var r = DICT.rec; DICT.rec = null; try { r.stop(); } catch(e){} }
  dictCommit(); dictSetBtn(false); dictStatus('');
}
function dictHelp(kind){
  var h = '<h2>🎙️ La dictée ne démarre pas</h2>';

    h += IOS_CHROME

  } else if (kind === 'denied'){
    h += IS_IOS
      ? '<p>L\'iPhone a refusé le micro. Vérifie :</p><p>1. <b>Réglages › Général › Clavier › Activer la dictée</b> doit être allumé.<br>2. <b>Réglages › Safari › Microphone</b> : choisis « Demander » ou « Autoriser ».<br>3. Recharge la page et touche « Dicter » : accepte quand Safari demande le micro.</p>'
      : '<p>Le navigateur a refusé le micro. Touche le cadenas à côté de l\'adresse du site, autorise le <b>micro</b>, puis recharge la page.</p>';
  } else {
    h += '<p>La reconnaissance vocale n\'a pas pu démarrer (' + esc(kind) + '). Elle a besoin d\'une <b>connexion internet</b>.</p>';
  }
  h += '<p class="souffleur">💡 Plan B qui marche toujours : touche la zone de texte, puis le <b>🎤 du clavier</b> de ton téléphone, et récite.</p><button class="btn gold big" data-act="close">OK</button>';
  openModal(h);
}
function startRec(t){
  var r = new SR();
  r.lang = ttsCode(t.lang);
  r.continuous = !IS_IOS;          /* le mode continu est instable sur iPhone : on relance à chaque pause */
  r.interimResults = true;         /* on affiche le texte en direct, même s'il n'est pas « final » */
  r.maxAlternatives = 1;
  r.onresult = function(e){
    var txt = '';
    for (var i = 0; i < e.results.length; i++){ txt += (txt ? ' ' : '') + String(e.results[i][0].transcript).replace(/^\s+|\s+$/g,''); }
    DICT.said = txt; DICT.restarts = 0;
    var area = document.getElementById('gen');
    if (area){ area.value = dictJoin(DICT.base, DICT.said); V.p.draft = area.value; area.scrollTop = area.scrollHeight; }
    dictStatus('<span class="small muted">🎙️ J\'entends : « … ' + esc(txt.split(' ').slice(-6).join(' ')) + ' »</span>');
  };
  r.onerror = function(ev){
    var code = ev && ev.error ? ev.error : 'erreur';
    if (code === 'no-speech' || code === 'aborted') return;   /* silence : on relancera */
    DICT.err = code; DICT.on = false;
    if (code === 'not-allowed' || code === 'service-not-allowed') dictHelp('denied');
    else if (code === 'network') dictHelp('réseau');
    else toast('🎙️ Micro : ' + code);
  };
  r.onend = function(){
    if (DICT.rec !== r) return;
    dictCommit();
    if (DICT.on && V.name === 'generale' && DICT.restarts < 30){
      DICT.restarts++;
      try { DICT.rec = startRec(t); return; } catch(e){}
    }

  };

}
function toggleDictation(t){

var TAKES = {};
var recorder = null, recStream = null, recStart = 0, recTimer = null;
function stopRecorder(){ if (recorder && recorder.state !== 'inactive'){ try { recorder.stop(); } catch(e){} } }
function toggleRecord(t){
  if (recorder && recorder.state !== 'inactive'){ stopRecorder(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof window.MediaRecorder === 'undefined'){
    openModal('<h2>⏺️ Enregistrement indisponible</h2><p>Ce navigateur (ou cette page) ne donne pas accès au micro. Ouvre l\'appli directement dans Safari ou Chrome. En attendant, tu peux utiliser l\'appli Dictaphone de ton téléphone : le principe est le même !</p><button class="btn gold big" data-act="close">OK</button>');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    recStream = stream;
    var chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = function(){
      var blob = new Blob(chunks, { type: recorder.mimeType || 'audio/mp4' });
      var dur = Math.round((Date.now() - recStart)/1000);
      if (!TAKES[t.id]) TAKES[t.id] = [];
      TAKES[t.id].push({ url: URL.createObjectURL(blob), dur: dur });
      if (recStream){ var tr = recStream.getTracks(); for (var i = 0; i < tr.length; i++) tr[i].stop(); }
      recStream = null; clearInterval(recTimer);
      practiced(t); save();
      if (V.name === 'enreg') render();
    };
    recorder.start(); recStart = Date.now();
    var b = document.getElementById('recBtn');
    if (b){ b.className = 'btn on big'; }
    recTimer = setInterval(function(){
      var bb = document.getElementById('recBtn'); if (!bb) return;
      var s = Math.round((Date.now() - recStart)/1000);
      bb.innerHTML = '<span class="recdot"></span>Enregistrement… ' + Math.floor(s/60) + ':' + pad(s%60) + ' · stop';
    }, 500);
  })['catch'](function(){
    openModal('<h2>🎙️ Micro refusé</h2><p>Le navigateur n\'a pas donné accès au micro. Autorise-le dans les réglages du navigateur, ou ouvre l\'appli directement (pas dans un aperçu).</p><button class="btn gold big" data-act="close">OK</button>');
  });
}

/* ---------------- partage ---------------- */
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64dec(s){ s = String(s).replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function shareCode(t){
  var o = { k:t.kind, ti:t.title, au:t.author, su:t.subject, la:t.lang };
  if (t.kind === 'lecon'){ o.ca = []; for (var i = 0; i < t.cards.length; i++) o.ca.push([t.cards[i].q, t.cards[i].a]); }
  else o.li = t.lines;
  return 'B2Y' + b64enc(JSON.stringify(o));
}
function parseShare(code){
  code = String(code).replace(/\s/g,'');
  var m = code.match(/B2Y([A-Za-z0-9_\-]+)/);
  if (!m) return null;
  try {
    var o = JSON.parse(b64dec(m[1]));
    if (!o || !o.ti) return null;
    var d = { kind:o.k, title:o.ti, author:o.au, subject:o.su, lang:o.la, lines:o.li || [], cards:[] };
    if (o.ca){ for (var i = 0; i < o.ca.length; i++) d.cards.push({ q:o.ca[i][0], a:o.ca[i][1] }); }
    if (d.kind === 'lecon' ? !d.cards.length : !d.lines.length) return null;
    return d;
  } catch(e){ return null; }
}
function shareLink(t){
  var base = String(location.href).split('#')[0].split('?')[0];
  if (!/^https?:/.test(base)) return '';
  return base + '#' + shareCode(t);
}
function copyText(txt, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select(); try { ta.setSelectionRange(0, txt.length); } catch(e){}
    var ok = false; try { ok = document.execCommand('copy'); } catch(e2){}
    document.body.removeChild(ta);
    toast(ok ? okMsg : 'Sélectionne le texte et copie-le à la main');
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast(okMsg); }, fallback); }
    else fallback();
  } catch(e){ fallback(); }
}

/* ---------- générale (poème / texte) ---------- */
VIEWS.generale = function(p){
  var t = getT(p.id), L = p.subset && p.subset.length ? p.subset : learnIdx(t), i;
  var h = topbar(p.subset ? '🌙 Veille ciblée' : '🎬 La générale') + '<main class="wrap">';
  if (p.res){
    var r = p.res, verdict = r.score >= 95 ? 'Standing ovation ! 👏👏👏' : r.score >= 80 ? 'Bravo, le public applaudit ! 👏' : r.score >= 50 ? 'Pas mal ! Encore quelques répétitions.' : 'Le rideau tombe trop tôt… on répète !';
    h += '<section class="card"><div class="score">' + r.score + ' %</div><div class="verdict">' + verdict + '</div>';
    h += '<p class="small legend center"><span class="r-ok">■ juste</span> <span class="r-acc">■ presque</span> <span class="r-miss">■ oublié</span></p>';
    h += '<div class="reading">';
    var byLine = {};
    for (i = 0; i < r.words.length; i++){ var w = r.words[i]; if (!byLine[w.li]) byLine[w.li] = []; byLine[w.li].push('<span class="r-' + w.s + '">' + esc(w.text) + '</span>'); }
    var prev = -1;
    for (i = 0; i < L.length; i++){
      if (!p.subset && prev >= 0 && L[i] > prev + 1) h += '<div class="gap"></div>';
      var pl = r.perLine[L[i]], good = pl && pl.tot ? pl.ok / pl.tot >= 0.9 : true;
      h += '<div class="line"><span class="lmark">' + (good ? '✅' : '🔁') + '</span>' + (byLine[L[i]] || []).join(' ') + '</div>';

    }
    h += '</div>';
    var notes = [];
    if (r.accents) notes.push(r.accents + ' mot(s) presque juste(s) : vérifie les accents et l\'orthographe.');
    if (r.extra) notes.push(r.extra + ' mot(s) en trop ou différent(s) dans ta récitation.');
    if (p.souf) notes.push('Souffleur appelé ' + p.souf + ' fois.');
    if (notes.length) h += '<p class="small muted">' + esc(notes.join(' ')) + '</p>';
    h += '</section>';
    var weak = weakLines(t, r);
    if (weak.length) h += '<button class="btn gold big" data-act="redoWeak">🎯 Retravailler les ' + weak.length + ' ligne(s) ratée(s)</button>';
    h += '<button class="btn ghost big" data-act="genRestart">↺ Refaire la générale</button><button class="btn ghost big" data-act="back">‹ Retour à la loge</button>';
    return h + '</main>';
  }
  if (p.souf == null) p.souf = 0;
  h += '<section class="card"><p style="margin-top:0"><b>Récite sans regarder.</b> ' + (p.subset ? 'Seulement les <b>' + L.length + ' ligne(s)</b> à retravailler.' : 'Tout le texte : ' + L.length + ' ' + KINDS[t.kind].unit + '.') + ' Écris ' + (t.kind === 'poeme' ? 'en allant à la ligne à chaque vers' : 'ton texte') + ', ou dicte-le avec le micro.</p>';
  if (p.subset){
    h += '<p class="small muted">Les lignes à retrouver commencent par :</p><div class="reading small">';
    for (i = 0; i < L.length; i++) h += '<div class="line faded">' + esc(splitWords(t.lines[L[i]]).slice(0,1).join(' ')) + ' …</div>';
    h += '</div>';
  }
  h += '<textarea id="gen" data-bind="draft" placeholder="Écris ta récitation ici…" autocapitalize="sentences" spellcheck="false">' + esc(p.draft || '') + '</textarea>';
  h += '<div id="dictStatus"></div><div id="souf"></div>';
  h += '<div class="row"><button class="btn ghost" id="dictBtn" data-act="dictate">🎙️ Dicter</button><button class="btn ghost" data-act="souffleur">💡 Souffleur</button></div></section>';
  h += '<div class="stickybar"><button class="btn gold big" data-act="genCheck">🎭 Lever de rideau : je vérifie !</button></div>';
  return h + '</main>';
};
function weakLines(t, r){
  var out = [];
  for (var li in r.perLine){ var pl = r.perLine[li]; if (pl.tot && pl.ok / pl.tot < 0.9) out.push(+li); }
  out.sort(function(a, b){ return a - b; });
  return out;
}

function previewTxt(d){
  if (d.kind === 'lecon') return '';

}

/* =========================================================
   ACTIONS
   ========================================================= */
var ACT = {};
function curT(){ return getT(V.p.id); }
ACT.back = function(){
  if (V.name === 'loge' || (V.name === 'editor' && !V.p.id)) go('home');
  else if (V.name === 'editor') go('loge', { id:V.p.id });
  else if (V.name === 'home') return;
  else go('loge', { id:V.p.id });
};
ACT.open = function(el){ go('loge', { id: el.getAttribute('data-id') }); };
ACT.newText = function(){ go('editor', {}); };
ACT.edit = function(el){ go('editor', { id: el.getAttribute('data-id') }); };
ACT.mode = function(el){
  var m = el.getAttribute('data-m'), t = curT(); if (!t) return;
  if (m === 'veille'){
    if (t.kind === 'lecon'){
      var weak = []; for (var i = 0; i < t.cards.length; i++){ if ((t.cards[i].box || 1) <= 2) weak.push(i); }
      go('lgenerale', { id:t.id, subset: weak.length ? weak : null });
    } else {
      var L = learnIdx(t), wl = [];
      for (var j = 0; j < L.length; j++){ if ((t.strength[L[j]] || 0) < 2) wl.push(L[j]); }
      if (!wl.length || wl.length === L.length) go('generale', { id:t.id });
      else go('generale', { id:t.id, subset:wl });
    }
    return;
  }
  go(m, { id:t.id });
};
/* lecture */
ACT.readAll = function(){ var t = curT(); readFrom(t, 0, true); };
ACT.stopRead = function(){ stopSpeak(); };
ACT.readLine = function(el){ var t = curT(); readTok++; var i = +el.getAttribute('data-i'); clearHL(); el.className += ' hl'; var tok = readTok; speak(readItems(t)[i], t.lang, function(){ if (tok === readTok) clearHL(); }); };
ACT.readDone = function(){ var t = curT(); award(t, 'lu'); practiced(t); save(); toast('🎟️ Lecture validée !'); go('loge', { id:t.id }); };
/* vers par vers */
ACT.chain = function(el){
  var t = curT(), d = el.getAttribute('data-do'), N = learnIdx(t).length, p = V.p;
  if (d === 'hide'){ stopSpeak(); p.ph = 'test'; }
  else if (d === 'check') p.ph = 'check';
  else if (d === 'again') p.ph = 'learn';
  else if (d === 'ok'){
    if (p.k >= N){ p.ph = 'done'; t.chainPos = 1; award(t, 'repete'); practiced(t); }
    else { p.k++; p.ph = 'learn'; t.chainPos = p.k; }
    save();
  }
  else if (d === 'restart'){ p.k = 1; p.ph = 'learn'; t.chainPos = 1; save(); }
  else if (d === 'listen'){ speak(t.lines[learnIdx(t)[p.k-1]], t.lang); return; }
  render(); try { window.scrollTo(0,0); } catch(e){}
};
/* effacement */
ACT.setLv = function(el){ V.p.lv = +el.getAttribute('data-lv'); render(); };
ACT.peek = function(el){
  if (/peeked/.test(el.className)) return;
  el.className += ' peeked'; V.p.souf = (V.p.souf || 0) + 1;
};
ACT.effOk = function(){
  var t = curT(), lv = V.p.lv;
  if (lv >= 3){ award(t, 'repete'); }
  practiced(t);
  if (lv < 4){ V.p.lv = lv + 1; t.effLevel = V.p.lv; V.p.souf = 0; save(); render(); try { window.scrollTo(0,0); } catch(e){} toast('Niveau suivant : ' + LEVELS[V.p.lv]); }
  else {
    t.effLevel = 4; save();
    if (NEWSTARS.length) flushStars();
    else openModal('<h2>🎭 Rideau fermé… et tu sais tout !</h2><p>Il est temps de passer à <b>la générale</b> pour le prouver.</p><button class="btn gold big" data-act="mode" data-m="' + (t.kind === 'lecon' ? 'lgenerale' : 'generale') + '">🎬 Tenter la générale</button><button class="btn ghost big" data-act="close">Plus tard</button>');
  }
};
/* générale */
ACT.dictate = function(){ toggleDictation(curT()); };
ACT.souffleur = function(){
  var t = curT(), L = V.p.subset && V.p.subset.length ? V.p.subset : learnIdx(t);
  var ta = document.getElementById('gen'), typed = ta ? ta.value : '';
  var n = typed.split('\n').filter(function(l){ return l.replace(/\s/g,'') !== ''; }).length;
  var box = document.getElementById('souf');
  if (n >= L.length){ if (box) box.innerHTML = '<div class="souffleur">💡 Tu as déjà écrit autant de lignes que le texte en compte !</div>'; return; }
  var ws = splitWords(t.lines[L[n]]);
  V.p.souf = (V.p.souf || 0) + 1;
  if (box) box.innerHTML = '<div class="souffleur">💡 Ligne ' + (n+1) + ' : « ' + esc(ws.slice(0, 2).join(' ')) + ' … »</div>';
};
ACT.genCheck = function(){
  var t = curT(), p = V.p, ta = document.getElementById('gen');
  p.draft = ta ? ta.value : (p.draft || '');
  if (p.draft.replace(/\s/g,'') === ''){ toast('✍️ Écris (ou dicte) ta récitation d\'abord !'); return; }
  stopDictation();
  var L = p.subset && p.subset.length ? p.subset : learnIdx(t);
  var r = compareText(t.lines, L, p.draft);
  for (var li in r.perLine){
    var pl = r.perLine[li], i = +li;
    if (pl.tot && pl.ok / pl.tot >= 0.9) t.strength[i] = Math.min((t.strength[i] || 0) + 1, 3);
    else t.strength[i] = 0;
  }
  p.res = r;
  recordSession(t, p.subset ? 'veille' : 'generale', r.score);
  render(); try { window.scrollTo(0,0); } catch(e){}
};
ACT.genRestart = function(){ var t = curT(); go('generale', { id:t.id }); };
ACT.redoWeak = function(){ var t = curT(); var w = weakLines(t, V.p.res); go('generale', { id:t.id, subset:w }); };
/* enregistrement */
ACT.record = function(){ toggleRecord(curT()); };
ACT.toggleShow = function(){ V.p.show = !V.p.show; render(); };
/* questions */
ACT.qShow = function(){ V.p.shown = true; render(); };
ACT.qSpeak = function(){ var t = curT(); speak(t.cards[V.p.queue[V.p.pos]].q, t.lang); };
ACT.qRate = function(el){
  var t = curT(), p = V.p, r = +el.getAttribute('data-r'), ci = p.queue[p.pos], c = t.cards[ci];
  if (r === 2){ c.box = Math.min((c.box || 1) + 1, 5); p.res.ok++; }
  else if (r === 1){ c.box = Math.max(1, (c.box || 1)); p.res.mid++; }
  else { c.box = 1; p.res.ko++; if (!p.retried[ci]){ p.retried[ci] = true; p.queue.push(ci); } }
  p.pos++; p.shown = false;
  if (p.pos >= p.queue.length){ award(t, 'repete'); practiced(t); }
  save(); render();
};
/* générale leçon */
ACT.lCheck = function(){ var ta = document.getElementById('lans'); V.p.ans = ta ? ta.value : ''; V.p.ph = 'check'; render(); };
ACT.lRate = function(el){
  var t = curT(), p = V.p, ok = el.getAttribute('data-r') === '1', c = t.cards[p.list[p.pos]];
  if (ok){ p.ok++; c.box = Math.min((c.box || 1) + 1, 5); } else c.box = 1;
  p.pos++; p.ph = 'ask'; p.ans = '';
  if (p.pos >= p.list.length){ recordSession(t, p.subset ? 'veille' : 'generale', Math.round(p.ok / p.list.length * 100)); }
  else save();
  render(); try { window.scrollTo(0,0); } catch(e){}
};
/* éditeur */
ACT.setKind = function(el){
  var d = V.p.d, nk = el.getAttribute('data-k');
  if (d.kind === nk) return;
  if (V.p.id){ var t = getT(V.p.id); if ((t.kind === 'lecon') !== (nk === 'lecon')){ toast('Pour changer de type, crée plutôt un nouveau texte'); return; } }
  d.kind = nk; render();
};
ACT.addCard = function(){ V.p.d.cards.push({ q:'', a:'' }); render(); };
ACT.delCard = function(el){ V.p.d.cards.splice(+el.getAttribute('data-ci'), 1); if (!V.p.d.cards.length) V.p.d.cards.push({ q:'', a:'' }); render(); };
ACT.toggleBulk = function(){ V.p.bulk = !V.p.bulk; render(); };
ACT.bulkAdd = function(){
  var ta = document.getElementById('bulk'); if (!ta) return;
  var lines = ta.value.replace(/\r/g,'').split('\n'), added = 0, d = V.p.d;
  d.cards = d.cards.filter(function(c){ return (c.q + c.a).replace(/\s/g,'') !== ''; });
  for (var i = 0; i < lines.length; i++){
    var l = lines[i].replace(/^\s+|\s+$/g,''); if (!l) continue;
    var q, a, pos = l.indexOf('|');
    if (pos < 0) pos = l.indexOf('\t');
    if (pos >= 0){ q = l.slice(0, pos); a = l.slice(pos + 1); }
    else { var qi = l.indexOf('?'); if (qi >= 0){ q = l.slice(0, qi + 1); a = l.slice(qi + 1); } else { q = l; a = ''; } }
    q = q.replace(/^\s+|\s+$/g,''); a = a.replace(/^\s+|\s+$/g,'');
    if (q){ d.cards.push({ q:q, a:a }); added++; }
  }
  if (!d.cards.length) d.cards.push({ q:'', a:'' });
  V.p.bulk = false; render(); toast(added + ' question(s) ajoutée(s)');
};
ACT.saveText = function(){
  var d = V.p.d, err = document.getElementById('err');
  d.title = String(d.title).replace(/^\s+|\s+$/g,'');
  if (!d.title){ err.textContent = '⚠️ Donne un titre à ton texte.'; return; }
  var lines = [], cards = [], i;
  if (d.kind === 'lecon'){
    for (i = 0; i < d.cards.length; i++){
      var q = String(d.cards[i].q).replace(/^\s+|\s+$/g,''), a = String(d.cards[i].a).replace(/^\s+|\s+$/g,'');
      if (q && a) cards.push({ q:q, a:a });
      else if (q || a){ err.textContent = '⚠️ La question ' + (i+1) + ' doit avoir une question ET une réponse.'; return; }
    }
    if (!cards.length){ err.textContent = '⚠️ Ajoute au moins une question avec sa réponse.'; return; }
  } else {
    lines = d.kind === 'poeme' ? splitLines(d.raw) : splitSentences(d.raw);
    if (!learnIdxArr(lines)){ err.textContent = '⚠️ Colle ou écris ton texte.'; return; }
  }
  var t;
  if (V.p.id){
    t = getT(V.p.id);
    var changed = t.lines.join('\n') !== lines.join('\n');
    t.kind = d.kind; t.title = d.title; t.author = d.author; t.subject = d.subject; t.lang = d.lang; t.due = d.due;
    if (d.kind === 'lecon'){
      var old = {}; for (i = 0; i < t.cards.length; i++) old[t.cards[i].q] = t.cards[i].box;
      t.cards = cards.map(function(c){ return { q:c.q, a:c.a, box: old[c.q] || 1 }; });
    } else if (changed){ t.lines = lines; t.strength = []; t.chainPos = 1; t.effLevel = 0; }
    fixStrength(t);
    if (t.lastPractice) t.nextReview = computeNext(t);
  } else {
    t = makeText({ kind:d.kind, title:d.title, author:d.author, subject:d.subject, lang:d.lang, due:d.due, lines:lines, cards:cards, color: S.texts.length % COLORS.length });
    S.texts.push(t);
  }
  save(); toast('🎭 « ' + t.title + ' » est à l\'affiche !');
  go('loge', { id:t.id });
};
/* partage */
ACT.share = function(el){
  var t = getT(el.getAttribute('data-id')), link = shareLink(t), code = shareCode(t);
  var h = '<h2>🔗 Partager « ' + esc(t.title) + ' »</h2><p>Idéal pour un prof qui envoie le texte à toute sa classe (ENT, Pronote, mail…). Seul le texte est partagé, pas tes étoiles.</p>';
  if (link) h += '<label class="f">Le lien</label><div class="codebox">' + esc(link) + '</div><button class="btn gold big" data-act="copy" data-what="link">📋 Copier le lien</button>';
  h += '<label class="f">Le code (si le lien ne s\'ouvre pas)</label><div class="codebox">' + esc(code) + '</div><button class="btn ghost big" data-act="copy" data-what="code">📋 Copier le code</button>';
  h += '<p class="small muted">L\'élève ouvre le lien, ou touche « J\'ai reçu un code » sur l\'accueil et le colle.' + (code.length > 6000 ? ' ⚠️ Ce texte est long : préfère le code au lien.' : '') + '</p><button class="btn ghost big" data-act="close">Fermer</button>';
  SHARE = { link:link, code:code };
  openModal(h);
};
var SHARE = null;
ACT.copy = function(el){ var w = el.getAttribute('data-what'); copyText(w === 'link' ? SHARE.link : SHARE.code, '📋 Copié !'); };
ACT.receive = function(){
  openModal('<h2>📥 J\'ai reçu un texte</h2><p>Colle ici le code ou le lien envoyé par ton professeur.</p><textarea id="recvCode" class="short" placeholder="B2Y…"></textarea><div class="err" id="recvErr"></div><button class="btn gold big" data-act="recvGo">Ouvrir</button><button class="btn ghost big" data-act="close">Annuler</button>');
};
ACT.recvGo = function(){
  var v = (document.getElementById('recvCode') || {}).value || '', d = parseShare(v);
  if (!d){ document.getElementById('recvErr').textContent = '⚠️ Ce code n\'est pas reconnu. Vérifie que tu l\'as copié en entier.'; return; }
  askImport(d);
};
ACT.doImport = function(){
  if (!PENDING) return closeModal();
  var due = (document.getElementById('impDue') || {}).value || '';
  var d = PENDING; d.due = due; d.color = S.texts.length % COLORS.length;
  var t = makeText(d); S.texts.push(t); save(); PENDING = null; closeModal();
  toast('🎭 Texte ajouté à tes affiches !'); go('loge', { id:t.id });
};
/* suppression / remise à zéro */
ACT.delText = function(el){
  var t = getT(el.getAttribute('data-id'));
  openModal('<h2>🗑️ Supprimer « ' + esc(t.title) + ' » ?</h2><p>Le texte et toutes ses étoiles disparaîtront.</p><button class="btn bad big" data-act="delYes" data-id="' + t.id + '">Oui, supprimer</button><button class="btn ghost big" data-act="close">Non, garder</button>');
};
ACT.delYes = function(el){
  var id = el.getAttribute('data-id');
  S.texts = S.texts.filter(function(x){ return x.id !== id; }); save(); closeModal(); go('home'); toast('Affiche décrochée');
};
ACT.resetText = function(el){
  var t = getT(el.getAttribute('data-id'));
  openModal('<h2>↺ Repartir de zéro ?</h2><p>Tu gardes le texte, mais ses étoiles, son historique et ses répétitions sont effacés. Pratique pour réapprendre un texte des mois plus tard.</p><button class="btn bad big" data-act="resetYes" data-id="' + t.id + '">Oui, tout reprendre</button><button class="btn ghost big" data-act="close">Annuler</button>');
};
ACT.resetYes = function(el){
  var t = getT(el.getAttribute('data-id'));
  t.stars = { lu:false, repete:false, generale:false, premiere:false }; t.sessions = []; t.stage = 0; t.nextReview = ''; t.lastPractice = ''; t.firstPerfect = ''; t.chainPos = 1; t.effLevel = 0; t.strength = [];
  for (var i = 0; i < t.cards.length; i++) t.cards[i].box = 1;
  fixStrength(t); save(); closeModal(); render();
};
/* modales génériques */
ACT.close = function(){ closeModal(); };
ACT.closeStar = function(){ closeModal(); if (NEWSTARS.length) flushStars(); else if (V.name === 'home' || V.name === 'loge') render(); };
ACT.help = function(){
  openModal('<h2>❔ Comment ça marche ?</h2>' +
    '<p><b>1. Mets ton texte à l\'affiche.</b> Poème, texte à réciter ou leçon : colle-le, et indique la date de passage.</p>' +
    '<p><b>2. Répète petit à petit.</b> Lecture, puis vers par vers, puis effacement : le texte disparaît jusqu\'au rideau fermé.</p>' +
    '<p><b>3. Passe la générale.</b> Récite sans regarder (à l\'écrit ou au micro). L\'appli te montre ce qui manque.</p>' +
    '<p><b>4. Reviens les jours suivants.</b> L\'appli te dit quand répéter : un peu chaque jour vaut mieux que tout la veille. La veille du contrôle, le mode 🌙 cible ce que tu ne sais pas encore.</p>' +
    '<p>Chaque étoile gagnée fait entrer un spectateur dans ton théâtre. 🎭</p>' +
    '<h3>Pour les professeurs</h3><p class="small">Créez le texte, puis 🔗 Partager : envoyez le lien ou le code à la classe. Chaque élève l\'ajoute dans sa propre appli. Aucune donnée ne quitte l\'appareil des élèves.</p>' +
    '<button class="btn gold big" data-act="close">C\'est parti !</button>');
};
ACT.settings = function(){
  var s = S.settings;
  function seg(key, opts){ var h = '<div class="seg">'; for (var i = 0; i < opts.length; i++) h += '<button class="' + (s[key] === opts[i][0] ? 'on' : '') + '" data-act="setS" data-k="' + key + '" data-v="' + opts[i][0] + '">' + esc(opts[i][1]) + '</button>'; return h + '</div>'; }
  openModal('<h2>⚙️ Réglages</h2>' +
    '<label class="f">Police</label>' + seg('font', [['std','Standard'],['lexend','Lexend (DYS)']]) +
    '<label class="f">Taille du texte</label>' + seg('size', [[1,'Normale'],[2,'Grande'],[3,'Très grande']]) +
    '<label class="f">Espacement des lignes</label>' + seg('spacing', [[1,'Normal'],[2,'Aéré']]) +
    '<label class="f">Vitesse de la voix</label>' + seg('rate', [[0.7,'Lente'],[0.9,'Normale'],[1.1,'Rapide']]) +
    '<hr style="border:0;border-top:1px dashed #e3cfac;margin:16px 0">' +
    '<button class="btn ghost big" data-act="reloadDemo">🎟️ Remettre les textes d\'exemple</button>' +
    '<button class="btn ghost big" data-act="wipe">🧹 Tout effacer</button>' +
    '<button class="btn gold big" data-act="close">Fermer</button>');
};
ACT.setS = function(el){
  var k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
  S.settings[k] = (k === 'font') ? v : +v; save(); applySettings(); ACT.settings();
};
ACT.reloadDemo = function(){
  var have = {}; for (var i = 0; i < S.texts.length; i++) have[S.texts[i].title] = true;
  var before = S.texts.length;
  for (var j = 0; j < DEMO.length; j++){
    if (have[DEMO[j].title]) continue;
    var d = DEMO[j];
    S.texts.push(makeText({ kind:d.kind, title:d.title, author:d.author, subject:d.subject, lang:d.lang, color:d.color, lines:d.lines, cards:d.cards, due:(d.dueIn != null ? addDays(today(), d.dueIn) : '') }));
  }
  save(); closeModal(); go('home'); toast((S.texts.length - before) + ' texte(s) d\'exemple ajouté(s)');
};
ACT.wipe = function(){
  openModal('<h2>🧹 Tout effacer ?</h2><p>Tous tes textes et toutes tes étoiles seront supprimés de cet appareil. Fais une sauvegarde 💾 avant si tu hésites.</p><button class="btn bad big" data-act="wipeYes">Oui, tout effacer</button><button class="btn ghost big" data-act="close">Annuler</button>');
};
ACT.wipeYes = function(){ S.texts = []; save(); closeModal(); go('home'); };
/* sauvegarde */
ACT.backup = function(){
  openModal('<h2>💾 Sauvegarde</h2><p>Tes textes et tes étoiles sont gardés dans ce navigateur. Pour les retrouver sur un autre appareil, ou ne rien perdre si l\'historique est effacé, fais une sauvegarde.</p>' +
    '<button class="btn gold big" data-act="exportFile">⬇️ Télécharger ma sauvegarde</button>' +
    '<button class="btn ghost big" data-act="exportCopy">📋 Copier ma sauvegarde (texte)</button>' +
    '<button class="btn ghost big" data-act="importFile">⬆️ Charger une sauvegarde (fichier)</button>' +
    '<label class="f" style="margin-top:10px">… ou colle une sauvegarde copiée</label><textarea id="impTxt" class="short"></textarea><div class="err" id="impErr"></div><button class="btn ghost big" data-act="importTxt">Charger ce texte</button>' +
    '<button class="btn ghost big" data-act="close">Fermer</button>');
};
function backupJSON(){ return JSON.stringify({ app:'par-coeur', v:1, date:today(), texts:S.texts }); }
ACT.exportFile = function(){
  try {
    var blob = new Blob([backupJSON()], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'par-coeur-sauvegarde-' + today() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('⬇️ Sauvegarde téléchargée (si rien ne se passe, utilise « Copier »)');
  } catch(e){ toast('Téléchargement impossible ici : utilise « Copier »'); }
};
ACT.exportCopy = function(){ copyText(backupJSON(), '📋 Sauvegarde copiée : colle-la dans une note ou un mail'); };
ACT.importFile = function(){ document.getElementById('importFile').click(); };
ACT.importTxt = function(){ var v = (document.getElementById('impTxt') || {}).value || ''; if (!importBackup(v)) document.getElementById('impErr').textContent = '⚠️ Ce texte n\'est pas une sauvegarde de Par Cœur !'; };
function importBackup(txt){
  var o; try { o = JSON.parse(txt); } catch(e){ return false; }
  if (!o || (o.app !== 'par-coeur' && o.app !== 'les-coulisses') || !o.texts) return false;
  var map = {}, i, added = 0, upd = 0;
  for (i = 0; i < S.texts.length; i++) map[S.texts[i].id] = i;
  for (i = 0; i < o.texts.length; i++){
    var t = o.texts[i]; if (!t || !t.id || !t.title) continue;
    fixStrength(t); if (!t.stars) t.stars = { lu:false, repete:false, generale:false, premiere:false }; if (!t.sessions) t.sessions = [];
    if (map[t.id] != null){ S.texts[map[t.id]] = t; upd++; } else { S.texts.push(t); added++; }
  }
  save(); closeModal(); go('home'); toast('💾 ' + added + ' ajouté(s), ' + upd + ' mis à jour');
  return true;
}
document.getElementById('importFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){ if (!importBackup(String(r.result))) toast('⚠️ Fichier non reconnu'); };
  r.readAsText(f); e.target.value = '';
});

/* ---------------- écouteurs globaux ---------------- */
document.addEventListener('click', function(e){
  var el = e.target;
  while (el && el !== document && !(el.getAttribute && el.getAttribute('data-act'))) el = el.parentNode;
  if (!el || el === document){ if (e.target === modalEl) closeModal(); return; }
  var a = el.getAttribute('data-act');
  if (ACT[a]) ACT[a](el, e);
});
document.addEventListener('input', function(e){
  var el = e.target, b = el.getAttribute && el.getAttribute('data-bind');
  if (!b) return;
  if (b === 'draft') V.p.draft = el.value;
  else if (b === 'ans') V.p.ans = el.value;
  else if (b === 'card'){ V.p.d.cards[+el.getAttribute('data-ci')][el.getAttribute('data-f')] = el.value; }
  else if (b.indexOf('d.') === 0){
    V.p.d[b.slice(2)] = el.value;
    if (b === 'd.raw'){ var pv = document.getElementById('preview'); if (pv) pv.textContent = previewTxt(V.p.d); }
  }
  if (el.id === 'rate'){ S.settings.rate = +el.value; save(); }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.id === 'rate'){ S.settings.rate = +el.value; save(); }
  var b = el.getAttribute && el.getAttribute('data-bind');
  if (b && b.indexOf('d.') === 0) V.p.d[b.slice(2)] = el.value;
});
document.addEventListener('keydown', function(e){ if ((e.key === 'Escape' || e.keyCode === 27) && !/hidden/.test(modalEl.className)) closeModal(); });
if (hasTTS && window.speechSynthesis.onvoiceschanged !== undefined){ window.speechSynthesis.onvoiceschanged = function(){}; }

/* ---------------- rapport d'erreur visible ---------------- */
window.onerror = function(msg, src, line){
  openModal('<h2>😬 Petit souci technique</h2><p>Quelque chose a planté. Fais une capture de ce message pour le prof :</p><div class="codebox">' + esc(String(msg) + ' (ligne ' + line + ') · vue : ' + V.name) + '</div><button class="btn gold big" data-act="close">OK</button>');
  return false;
};

/* ---------------- démarrage ---------------- */
applySettings();
render();
(function(){
  var h = String(location.hash || '');
  if (h.indexOf('B2Y') >= 0){
    var d = parseShare(h);
    try { history.replaceState(null, '', String(location.href).split('#')[0]); } catch(e){}
    if (d) askImport(d); else toast('⚠️ Lien de partage incomplet');
  }
})();

})();
</script>
